<title>Genx Video Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: an editing-bay control room. Sticky tab rail, a contact-sheet library of real frames, a brief builder beside a production queue. */
:root{
  --bg:#E9ECEF; --surface:#F6F7F9; --raised:#FFFFFF; --ink:#12161B; --ink2:#505A67; --line:#D3D8DF;
  --accent:#2C49D8; --accent-ink:#FFFFFF; --accent-soft:rgba(44,73,216,.10);
  --elevate:#0F7F75; --ascentra:#6141DB; --studio:#8D6A0E;
  --ok:#1C7A43; --warn:#A35C00; --rec:#C8322A; --film:#171B21;
  --f-display:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
  --f-body:'Instrument Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1014; --surface:#141920; --raised:#1A2028; --ink:#E7EBF0; --ink2:#9AA6B4; --line:#29313B;
  --accent:#8197FF; --accent-ink:#0D1014; --accent-soft:rgba(129,151,255,.14);
  --elevate:#3DC6B8; --ascentra:#A68DFF; --studio:#E0BB55; --ok:#4CC27E; --warn:#F0A64A; --rec:#FF6B5E; --film:#07090B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1014; --surface:#141920; --raised:#1A2028; --ink:#E7EBF0; --ink2:#9AA6B4; --line:#29313B;
  --accent:#8197FF; --accent-ink:#0D1014; --accent-soft:rgba(129,151,255,.14);
  --elevate:#3DC6B8; --ascentra:#A68DFF; --studio:#E0BB55; --ok:#4CC27E; --warn:#F0A64A; --rec:#FF6B5E; --film:#07090B; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
a{color:var(--accent)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.01em}
.eyebrow{font:700 11.5px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}

/* header */
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;flex-wrap:wrap;gap:18px 32px;align-items:flex-end;justify-content:space-between;padding-block:28px 22px}
.brand{display:flex;gap:14px;align-items:center}
.slate{width:44px;height:44px;flex:none}
.brand h1{font-size:30px;font-weight:800;line-height:1}
.brand p{margin:4px 0 0;color:var(--ink2);font-size:14px}
.stats{display:flex;flex-wrap:wrap;gap:6px 26px}
.stat b{display:block;font:700 22px var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--ink2)}

/* tabs */
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{flex:none;background:none;border:0;padding:14px 14px 12px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button .n{font:600 11px var(--f-mono);color:var(--ink2);margin-left:6px}
main{padding-block:28px 80px}
section.tab{display:flex;flex-direction:column;gap:22px}
.lede{max-width:68ch;color:var(--ink2);margin:0}
.sechead{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}
.sechead h2{font-size:26px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--raised);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .dot,.lane-dot{width:8px;height:8px;border-radius:50%;flex:none}
.tag{display:inline-flex;align-items:center;gap:5px;font:600 11.5px var(--f-mono);color:var(--ink2);white-space:nowrap}
.lane-elevate{--lc:var(--elevate)}.lane-ascentra{--lc:var(--ascentra)}.lane-studio{--lc:var(--studio)}
.lane-dot{background:var(--lc)}

/* library */
.group{display:flex;flex-direction:column;gap:12px}
.group h3{font-size:15px;font-family:var(--f-body);font-weight:700;display:flex;align-items:center;gap:10px;color:var(--ink2)}
.group h3 .lane-dot{width:10px;height:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:0;transition:transform .18s ease,box-shadow .18s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 26px -14px rgba(0,0,0,.35)}
.thumb{position:relative;aspect-ratio:4/3;background:var(--film);display:grid;place-items:center;overflow:hidden;max-width:100%}
.thumb img{width:100%;height:100%;object-fit:contain}
.thumb .tc{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.72);color:#fff;font:700 11px var(--f-mono);padding:3px 7px;border-radius:5px}
.thumb .fm{position:absolute;left:8px;bottom:8px;display:flex;gap:4px}
.thumb .fm i{font:700 10px var(--f-mono);font-style:normal;background:rgba(255,255,255,.88);color:#111;padding:2px 6px;border-radius:4px}
.card .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card .t{font-weight:700;font-size:15px;line-height:1.3}
.card .meta{display:flex;flex-wrap:wrap;gap:4px 12px}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;background:var(--surface)}
.empty p{margin:0;max-width:60ch;color:var(--ink2)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--raised);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:active{transform:translateY(1px)}

/* dialog */
dialog.detail{width:min(1100px,calc(100vw - 24px));max-height:calc(100dvh - 24px);border:1px solid var(--line);border-radius:16px;padding:0;background:var(--surface);color:var(--ink)}
dialog.detail::backdrop{background:rgba(5,8,12,.62)}
.dlg{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);min-height:0}
.dlg .player{background:var(--film);display:flex;flex-direction:column;justify-content:center;padding:18px;gap:10px;position:sticky;top:0;align-self:start;max-height:calc(100dvh - 26px)}
.dlg video{width:100%;max-height:calc(100dvh - 120px);border-radius:8px;background:#000}
.dlg .player .mono{color:#AEB7C3}
.dlg .info{padding:22px 24px 28px;display:flex;flex-direction:column;gap:20px;min-width:0;overflow:auto;max-height:calc(100dvh - 26px)}
.dlg .close{position:absolute;right:12px;top:12px;z-index:2}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 18px;margin:0}
.kv div{min-width:0}.kv dt{font-size:12px;color:var(--ink2)}.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.block{display:flex;flex-direction:column;gap:10px}
.block h4{margin:0;font:700 12px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.strip{overflow-x:auto;border-radius:8px;background:var(--film)}
.strip img{display:block;height:120px;max-width:none}

/* prompts */
.prompt{border:1px solid var(--line);border-radius:10px;background:var(--raised);padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.prompt .hd{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.prompt .txt{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;font-size:14.5px}
.prompt .txt.clamp{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.prompt .more{align-self:flex-start;background:none;border:0;color:var(--accent);font-weight:600;padding:0;cursor:pointer}
.badge{font:700 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--accent-soft);color:var(--accent)}
.badge.paste{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.badge.ans{background:color-mix(in srgb,var(--ascentra) 15%,transparent);color:var(--ascentra)}
.log{display:flex;flex-direction:column;gap:10px}
.logday{font:700 12px var(--f-mono);color:var(--ink2);letter-spacing:.08em;margin-top:10px}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 8px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink)}
.search{flex:1 1 260px;max-width:420px;border:1px solid var(--line);background:var(--raised);border-radius:10px;padding:9px 12px}

/* script timeline */
.tl{position:relative;height:36px;border-radius:6px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.tl i{position:absolute;top:6px;bottom:6px;border-radius:4px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent)}
.tl i span{position:absolute;left:5px;top:50%;transform:translateY(-50%);font:700 10px var(--f-mono);color:var(--accent)}
.lines{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.lines li{display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:baseline}
.lines .mono{color:var(--ink2)}

/* make */
.make{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:22px;align-items:start}
.panel{background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--surface);gap:3px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;border-radius:7px;font-weight:600;cursor:pointer;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.wide{grid-column:1/-1}
.field label{font-size:13px;font-weight:600}
.field small{color:var(--ink2);font-size:12px}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 11px;width:100%;min-width:0}
.field textarea{min-height:92px;resize:vertical}
.checks{display:flex;gap:14px;flex-wrap:wrap}
.checks label{display:flex;gap:6px;align-items:center;font-weight:500}
.out{background:var(--film);color:#DDE3EA;border-radius:10px;padding:14px;font:500 12.5px/1.6 var(--f-mono);white-space:pre-wrap;overflow-wrap:anywhere;max-height:380px;overflow:auto;margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.note{font-size:13px;color:var(--ink2);margin:0}
.queue{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.qi{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;background:var(--surface)}
.qi .t{font-weight:700;min-width:0;overflow-wrap:anywhere}
.qi .sub{grid-column:1/2;display:flex;gap:10px;flex-wrap:wrap}
.qi .act{grid-row:1/3;grid-column:2;display:flex;gap:6px;align-items:center}
.st{font:700 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px}
.st.queued{background:var(--accent-soft);color:var(--accent)}
.st.in-production{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.st.done{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:50}

/* pipeline */
.pipe{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;counter-reset:step}
.step{background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;position:relative}
.step .no{font:700 12px var(--f-mono);color:var(--accent)}
.step h3{font-size:18px}
.step p{margin:0;color:var(--ink2);font-size:14px}
.step pre{margin:0;background:var(--film);color:#DDE3EA;border-radius:8px;padding:10px;font:500 11.5px/1.5 var(--f-mono);white-space:pre-wrap;overflow-wrap:anywhere;max-height:210px;overflow:auto}
.step .tool{font:600 11.5px var(--f-mono);color:var(--ink2)}
.bigstrip{overflow-x:auto;border-radius:12px;background:var(--film);padding:10px}
.bigstrip img{display:block;height:220px;max-width:none}

/* styles */
.styles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.style{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.style .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.style p{margin:0;color:var(--ink2);font-size:14px;flex:1}
.meter{display:flex;gap:4px;align-items:center}
.meter i{width:18px;height:6px;border-radius:3px;background:var(--line)}
.meter i.on{background:var(--ascentra)}

.docs{display:flex;flex-direction:column;gap:12px}
details.doc{background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
details.doc summary{cursor:pointer;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;list-style:none}
details.doc summary::-webkit-details-marker{display:none}
details.doc summary b{font-size:16px}
details.doc pre{white-space:pre-wrap;overflow-wrap:anywhere;font:500 12.5px/1.6 var(--f-mono);background:var(--surface);border-radius:8px;padding:14px;margin:12px 0 0;max-height:560px;overflow:auto}

@media (max-width: 900px){.make{grid-template-columns:1fr}.pipe{grid-template-columns:repeat(2,minmax(0,1fr))}.dlg{grid-template-columns:1fr}.dlg .player{position:static;max-height:none}.dlg .info{max-height:none}.dlg video{max-height:60dvh}}
@media (max-width: 560px){.fields{grid-template-columns:1fr}.pipe{grid-template-columns:1fr}.brand h1{font-size:25px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card .body{padding:10px}.lines li{grid-template-columns:1fr}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<header class="top"><div class="wrap">
  <div class="brand">
    <svg class="slate" viewBox="0 0 44 44" aria-hidden="true"><rect x="3" y="15" width="38" height="25" rx="4" fill="var(--ink)"/><path d="M3 9 L39 4 L41 12 L5 17 Z" fill="var(--ink)"/><path d="M10 8 L14 15 M19 7 L23 14 M28 5.5 L32 12.5" stroke="var(--bg)" stroke-width="3"/><circle cx="34" cy="27.5" r="4" fill="var(--rec)"/></svg>
    <div><h1>Genx Video Studio</h1><p>Every video, the prompts that made it, and the queue for the next ones.</p></div>
  </div>
  <div class="stats" id="stats"></div>
</div></header>
<nav class="tabs" aria-label="Sections"><div class="wrap" role="tablist" id="tabs"></div></nav>
<main class="wrap">
  <section class="tab" id="t-library"></section>
  <section class="tab" id="t-make" hidden></section>
  <section class="tab" id="t-how" hidden></section>
  <section class="tab" id="t-styles" hidden></section>
  <section class="tab" id="t-log" hidden></section>
  <section class="tab" id="t-files" hidden></section>
</main>
<dialog class="detail" id="dlg" aria-label="Video details"></dialog>
<div class="toast" id="toast" hidden></div>

<script>
const DATA = /*__DATA__*/null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tc = s => { s = Math.round(s); return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };
const P = Object.fromEntries(DATA.prompts.map(p => [p.id, p]));
const V = Object.fromEntries(DATA.videos.map(v => [v.id, v]));
const S = Object.fromEntries(DATA.styles.map(s => [s.id, s]));
const LANES = DATA.lanes;
const fmtName = { '9x16': '9:16', '16x9': '16:9' };
const usedBy = {}; DATA.videos.forEach(v => v.prompts.forEach(id => (usedBy[id] = usedBy[id] || []).push(v.id)));
const docBy = {}; DATA.docs.forEach(d => (d.prompts || []).forEach(id => (docBy[id] = docBy[id] || []).push(d.id)));
const store = { get(k, d) { try { const v = localStorage.getItem('genx:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
                set(k, v) { try { localStorage.setItem('genx:' + k, JSON.stringify(v)); } catch {} } };
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2200); }
async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); toast('Copied'); }
  catch { const pre = btn?.closest('.panel,.step,.prompt')?.querySelector('pre,.txt'); if (pre) { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } toast('Copy blocked here: the text is selected, press Ctrl/Cmd+C'); }
}

/* ---------- stats + tabs ---------- */
const st = DATA.stats;
$('#stats').innerHTML = [[st.videos, 'videos'], [st.renders, 'rendered files'], [tc(st.seconds), 'min of footage'], [st.frames.toLocaleString('en-US'), 'frames rendered'], [st.prompts + st.answers, 'prompts logged']]
  .map(([b, s]) => `<div class="stat"><b>${b}</b><span>${s}</span></div>`).join('');
const TABS = [['library', 'Library', st.videos], ['make', 'Make a video'], ['how', "How it's made"], ['styles', 'Styles', DATA.styles.length], ['log', 'Prompt log', DATA.prompts.length], ['files', 'Prompt files', DATA.docs.length]];
$('#tabs').innerHTML = TABS.map(([id, name, n]) => `<button role="tab" id="tab-${id}" aria-controls="t-${id}" aria-selected="false">${name}${n != null ? `<span class="n">${n}</span>` : ''}</button>`).join('');
function show(id) {
  if (!TABS.some(t => t[0] === id)) id = 'library';
  TABS.forEach(([t]) => { $('#t-' + t).hidden = t !== id; $('#tab-' + t).setAttribute('aria-selected', t === id); });
  if (location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id);
  store.set('tab', id);
}
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { show(b.id.slice(4)); window.scrollTo({ top: 0 }); } });
addEventListener('hashchange', () => show(location.hash.slice(1)));

/* ---------- library ---------- */
let laneFilter = 'all';
function cardHTML(v) {
  return `<button class="card lane-${v.lane}" data-v="${v.id}" aria-label="${esc(v.title)}">
    <div class="thumb"><img src="media/${v.id}.jpg" alt="" loading="lazy"><span class="tc">${tc(v.dur)}</span>
      <span class="fm">${Object.keys(v.formats).map(f => `<i>${fmtName[f]}</i>`).join('')}</span></div>
    <div class="body"><div class="t">${esc(v.title)}</div>
      <div class="meta"><span class="tag"><span class="lane-dot"></span>${esc(S[v.style]?.name || v.style)}</span>${v.plan ? `<span class="tag">plan #${v.plan}</span>` : ''}</div></div></button>`;
}
function renderLibrary() {
  const lanes = Object.keys(LANES);
  const counts = Object.fromEntries(lanes.map(l => [l, DATA.videos.filter(v => v.lane === l).length]));
  let h = `<div class="sechead"><div><h2>Library</h2><p class="lede">Every finished video. Open one to watch it and to see the exact prompts, script and frames behind it.</p></div>
    <div class="chips" role="group" aria-label="Filter by lane"><button class="chip" aria-pressed="${laneFilter === 'all'}" data-lane="all">All · ${DATA.videos.length}</button>

/* ---------- styles ---------- */
function renderStyles() {
  $('#t-styles').innerHTML = `<div class="sechead"><div><h2>Style library</h2><p class="lede">Every look made so far. The bar shows how well each style suits a teaching video, for picking ASCENTRA course looks.</p></div></div>
  <div class="styles">${DATA.styles.map(s => { const vids = DATA.videos.filter(v => v.style === s.id);
    return `<div class="style"><div class="thumb"><img src="media/${s.poster}.jpg" alt="" loading="lazy"></div><div class="body"><b>${esc(s.name)}</b><p>${esc(s.best)}</p>
      <div class="row" style="justify-content:space-between"><span class="meter" title="Teaching fit ${s.teach} of 3"><span class="tag" style="margin-right:4px">Teaching</span>${[1, 2, 3].map(i => `<i class="${i <= s.teach ? 'on' : ''}"></i>`).join('')}</span>
      ${s.teach >= 2 ? `<button class="btn small" data-usestyle="${esc(s.name)}">Use for a lesson</button>` : ''}</div>
      <div class="links">${vids.map(v => `<button data-open="${v.id}">▶ ${esc(v.title)}</button>`).join('')}</div></div></div>`; }).join('')}</div>`;
}
$('#t-styles').addEventListener('click', e => { const b = e.target.closest('[data-usestyle]'); if (!b) return;
  lane = 'ascentra'; store.set('lane', lane); draft.ascentra = Object.assign(draft.ascentra || {}, { style: b.dataset.usestyle }); store.set('draft', draft); renderMake(); show('make'); window.scrollTo({ top: 0 }); });

/* ---------- prompt log + files ---------- */
let q = '';
function renderLog() {
  const items = DATA.prompts.filter(p => !q || p.text.toLowerCase().includes(q));
  let day = '', h = '';
  for (const p of items) { const d = new Date(p.t + 'Z').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    if (d !== day) { h += `<div class="logday">${d.toUpperCase()}</div>`; day = d; } h += promptHTML(p, { anchor: true }); }
  $('#logbody').innerHTML = h || '<p class="note">No prompts match that search.</p>';
}
function renderLogShell() {
  $('#t-log').innerHTML = `<div class="sechead"><div><h2>Prompt log</h2><p class="lede">Everything you've typed in this session, verbatim and in order, including your answers to Claude's questions. Each prompt links to the videos and files it produced.</p></div>
    <input class="search" id="logq" type="search" placeholder="Search prompts" aria-label="Search prompts"></div><div class="log" id="logbody"></div>`;
  $('#logq').addEventListener('input', e => { q = e.target.value.trim().toLowerCase(); renderLog(); }); renderLog();
}
function renderFiles() {
  $('#t-files').innerHTML = `<div class="sechead"><div><h2>Prompt files</h2><p class="lede">The reusable prompts, briefs and plans in the repo. These are what you reuse to make more videos without starting from scratch.</p></div></div>
  <div class="docs">${DATA.docs.map(d => `<details class="doc" id="doc-${d.id}"><summary><b>${esc(d.title)}</b><span class="mono">${esc(d.path)}</span><span class="note" style="flex-basis:100%">${esc(d.why)}</span></summary>
    <div class="row" style="margin-top:10px"><button class="btn small" data-copydoc="${d.id}">Copy file text</button></div><pre>${esc(d.text || 'File not found.')}</pre></details>`).join('')}</div>`;
}
$('#t-files').addEventListener('click', e => { const b = e.target.closest('[data-copydoc]'); if (b) copy(DATA.docs.find(d => d.id === b.dataset.copydoc).text, b); });

renderLibrary(); renderMake(); renderHow(); renderStyles(); renderLogShell(); renderFiles();
show(location.hash.slice(1) || store.get('tab', 'library'));
</script>
