  const ring = (r, col, w) => { x.strokeStyle = col; x.lineWidth = w; x.beginPath(); x.arc(256, 256, r, 0, 7); x.stroke(); };
  ring(240, C.teal, 18); ring(205, '#E9D7B0', 6); ring(150, C.coral, 10); ring(95, '#E9D7B0', 5);
  for (let i = 0; i < 24; i++) { const a = i / 24 * 6.283; x.fillStyle = '#E9D7B0'; x.beginPath(); x.arc(256 + Math.cos(a) * 178, 256 + Math.sin(a) * 178, 7, 0, 7); x.fill(); }

}

// ---------- the guide: an original paper parcel (cardboard box with flaps, ink eyes) ----------
function parcel(scale = 1) {
  const g = new THREE.Group(), legH = .26;
  const body = new THREE.Group(); g.add(body);
  const walls = box(1, .8, .82, C.kraft, .03); walls.position.y = legH + .4; body.add(walls);
  const seam = box(1.02, .02, .84, C.kraftD, .005); seam.position.y = legH + .8; body.add(seam);
  // two top flaps hinged on the front and back edges; they open when the parcel cheers
  const flaps = [1, -1].map(s => { const pv = new THREE.Group(); pv.position.set(0, legH + .81, s * .41); const f = box(1, .03, .41, C.kraftD, .01); f.position.z = -s * .205; pv.add(f); body.add(pv); return { pv, s }; });
  const tape = box(.18, .012, .86, C.tape, .004); tape.position.y = legH + .83; body.add(tape);
  const eyeM = new THREE.MeshStandardMaterial({ map: paperTex(C.ink), roughness: .9, emissive: new THREE.Color('#FFB061'), emissiveIntensity: 0 });
  const eyes = [-.2, .2].map(x => { const e = shade(new THREE.Mesh(new RoundedBoxGeometry(.13, .17, .04, 2, .02), eyeM)); e.position.set(x, legH + .5, .42); body.add(e); return e; });
  const mouth = box(.2, .045, .03, C.coral, .02); mouth.position.set(0, legH + .3, .42); body.add(mouth);
  const label = card(.34, .2, .01, C.paper, (x, w, h) => { x.fillStyle = C.ink; for (let i = 0; i < 3; i++) x.fillRect(6, 5 + i * 5, w - 12 - i * 6, 2); }, 300);
  label.position.set(.3, legH + .14, .42); label.rotation.z = -.08; body.add(label);
  const legs = [-.24, .24].map(x => { const l = box(.17, legH, .17, C.navy, .03); l.position.set(x, legH / 2, 0); g.add(l); return l; });
  const arms = [-1, 1].map(s => { const pv = new THREE.Group(); pv.position.set(s * .53, legH + .55, 0); const a = box(.1, .4, .1, C.kraftD, .03); a.position.y = -.18; pv.add(a); body.add(pv); return pv; });
  g.scale.setScalar(scale);
  return {
    g,
    pose(t, { hop = 0, squash = 1, wave = 0, cheer = 0, walk = 0, glow = 0, lean = 0, look = 0, think = 0 } = {}) {
      const breathe = Math.sin(t * 2.2) * .015;
      body.position.y = hop + breathe; body.rotation.z = lean + Math.sin(t * 1.3) * .015 + think * Math.sin(t * 1.6) * .06; body.rotation.y = look;
      body.scale.set(1 / Math.sqrt(squash), squash * (1 + breathe), 1 / Math.sqrt(squash));
      const lag = (squash - 1) * 3, blink = (t % 3.3) > 3.15 ? .15 : 1;
      eyes.forEach(e => e.scale.set(1, blink, 1)); eyeM.emissiveIntensity = glow * 1.3;
      mouth.scale.set(1 + cheer * .4, 1 + cheer * 1.6, 1);
      flaps.forEach(({ pv, s }) => { pv.rotation.x = s * (.12 + cheer * 1.1 + Math.sin(t * 9) * .05 * cheer); });
      const ph = walk * Math.PI * 2;
      legs[0].position.y = .13 + Math.max(0, Math.sin(ph)) * .12 * (walk ? 1 : 0) + hop * .3;
      legs[1].position.y = .13 + Math.max(0, -Math.sin(ph)) * .12 * (walk ? 1 : 0) + hop * .3;
      if (walk) body.position.y += Math.abs(Math.sin(ph)) * .06;
      arms[0].rotation.z = -.15 - lag - cheer * 2.4 + (walk ? Math.sin(ph) * .4 : 0) - think * .3;
      arms[1].rotation.z = .15 + lag + cheer * 2.4 + wave * (2.3 + Math.sin(t * 14) * .35) - (walk ? Math.sin(ph) * .4 : 0) + think * 2.2;
    },
  };
}

// ---------- scene builders: each returns { group, update(local) } at its own station ----------
const builds = [];
const at = (s, obj, x, y, z) => { obj.position.set(s * STEP + x, y, z); scene.add(obj); return obj; };
// pop-up-book entrance: the object folds up from flat on its bottom edge, overshoots a touch and settles
const box3 = new THREE.Box3();
function pop(o, p) {
  const u = o.userData;
  if (!u.rest) { box3.setFromObject(o); u.rest = { pos: o.position.clone(), rx: o.rotation.x, h: box3.max.y - box3.min.y }; }
  p = clamp(p); o.visible = p > 0;
  const a = -(Math.PI / 2) * (1 - back(p)), h = u.rest.h / 2;
  o.rotation.x = u.rest.rx + a;
  o.position.set(u.rest.pos.x, u.rest.pos.y - h + h * Math.cos(a), u.rest.pos.z + h * Math.sin(a));
}
function grow(o, p) { p = clamp(p); o.visible = p > 0; o.scale.setScalar(.6 + .4 * back(p)); o.rotation.z = (1 - eOut(p)) * .5; }
function jump(t, at, d = .5, h = .5) {
  const pre = prog(t, at - .14, .14), air = prog(t, at, d), land = prog(t, at + d, .26);
  let squash = 1, hop = 0;
  if (t < at) squash = 1 - .15 * Math.sin(pre * Math.PI / 2);
  else if (t < at + d) { hop = h * Math.sin(air * Math.PI); squash = 1 + .12 * Math.cos(air * Math.PI) * (air < .5 ? 1 : .6); }
  else squash = 1 - .16 * Math.sin(land * Math.PI) * (1 - land) + .04 * Math.sin(land * Math.PI * 2) * (1 - land);
  return { hop, squash };
}

  const s = 4, m = parcel(.85); at(s, m.g, 2.7, 0, 1.6);

  const stack = []; for (let k = 0; k < 12; k++) { const c = crate(1); at(s, c, -.9 + ((k % 3) - 1) * .62, .14 + Math.floor(k / 6) * .43, .1 + (Math.floor(k / 3) % 2 - .5) * .56); stack.push(c); }
  const cost = card(1.7, .95, .05, C.paper, (x, w, h) => { txt(x, 'COST PER ITEM', w / 2, 24, 14, { family: 'Oswald', weight: 600 }); txt(x, '$10', w / 2 - 34, 62, 30, { color: '#8A8F96' }); txt(x, '$4', w / 2 + 40, 62, 34, { color: C.teal }); x.fillStyle = C.coral; x.fillRect(w / 2 - 66, 60, 62, 4); txt(x, '→', w / 2 + 4, 62, 22); }, 260);
  at(s, cost, 1.55, 3.05, -.2); post(s, 1.55, -.3, 2.6);
  const store = card(1.5, .6, .04, C.teal, null, 260); at(s, store, -.9, 2.55, -.3);
  const coins = Array.from({ length: 6 }, () => at(s, coin(), 0, -3, 0));
  builds[4] = (l, t) => {
    pop(pallet, prog(l, .1, .4));
    coins.forEach((c, i) => { const p = prog(t, WT[4][2] - .1 + i * .07, .5); c.visible = p > 0 && p < 1; c.position.set(s * STEP + lerp(2.4, -.9, eInOut(p)), .9 + Math.sin(p * Math.PI) * 1.2, lerp(1.2, .1, p)); c.rotation.set(p * 6, 0, p * 3); });
    stack.forEach((c, i) => pop(c, prog(t, WT[4][6] + i * .09, .35)));
    pop(cost, prog(t, WT[4][11] - .2, .45));
    const n = Math.round(lerp(3, 40, eOut(prog(t, WT[4][17], 1.2))));
    store.userData.draw((x, w, h) => { txt(x, 'YOUR STORE', w / 2, 20, 12, { family: 'Oswald', weight: 600, color: '#E6FFF9' }); txt(x, `${n} LISTINGS`, w / 2, 43, 19, { color: '#fff' }); }, n);
    grow(store, prog(t, WT[4][17] - .2, .35));
    m.pose(l, { look: -.5, ...jump(t, WT[4][7] + .2, .45, .4), cheer: prog(t, WT[4][17], .3) * .8 });
  };
}

// station 5: stage 3 — a shop profile: photos post, followers climb, hearts float up
{
  const s = 5, m = parcel(.85); at(s, m.g, 2.3, 0, 1.7);
  const ph = phone(1.66, 2.95); at(s, ph.g, -.7, 2.0, 0); ph.g.rotation.y = .16;
  const hearts = Array.from({ length: 10 }, () => at(s, heart(), 0, -3, 0));
  const tags = [['REPEAT BUYERS', C.butter], ['SELLS FASTER', C.teal]].map(([l, col], i) => { const c = card(1.5, .42, .03, col, (x, w, h) => txt(x, l, w / 2, h / 2 + 1, 15, { color: col === C.teal ? '#fff' : C.ink }), 260); at(s, c, 1.55, 3.1 - i * .62, -.2); return c; });
  const tileCols = [C.coral, C.teal, C.butter, C.sky, C.pink, C.blue];
  builds[5] = (l, t) => {
    pop(ph.g, prog(l, .1, .5));
    const tiles = Math.floor(clamp((t - WT[5][3]) / .35, 0, 6)), fol = Math.round(1250 * eOut(prog(t, WT[5][8] - .2, 2.4)));
    ph.scr.userData.draw((x, w, h) => {
      x.fillStyle = C.ink; x.beginPath(); x.roundRect(w / 2 - 28, 10, 56, 8, 4); x.fill();
      x.fillStyle = C.kraft; x.beginPath(); x.arc(40, 56, 24, 0, 7); x.fill(); x.fillStyle = C.ink; x.fillRect(31, 50, 5, 7); x.fillRect(44, 50, 5, 7);
      txt(x, '@yourshop', 74, 46, 15, { align: 'left' });
      txt(x, `${fol.toLocaleString('en-US')} followers`, 74, 68, 12, { align: 'left', weight: 700, color: C.teal });
      for (let i = 0; i < tiles; i++) { const cx = 10 + (i % 3) * ((w - 20) / 3), cy = 96 + Math.floor(i / 3) * 74; x.fillStyle = tileCols[i]; x.beginPath(); x.roundRect(cx + 2, cy, (w - 20) / 3 - 4, 70, 6); x.fill(); x.fillStyle = 'rgba(255,255,255,.55)'; x.beginPath(); x.arc(cx + (w - 20) / 6, cy + 32, 14, 0, 7); x.fill(); }
      if (t > WT[5][12]) { x.fillStyle = C.teal; x.beginPath(); x.roundRect(14, h - 54, w - 28, 34, 17); x.fill(); txt(x, '3 SOLD TODAY', w / 2, h - 36, 13, { color: '#fff' }); }
    }, tiles * 100000 + fol + (t > WT[5][12] ? 1e7 : 0));
    hearts.forEach((hh, i) => { const cyc = ((t - WT[5][8]) * .7 + i / hearts.length) % 1; const on = t > WT[5][8]; hh.visible = on; hh.position.set(s * STEP + .55 + Math.abs(Math.sin(i * 2.3)) * .5 + Math.sin(cyc * 6 + i) * .12, 1.6 + cyc * 2.4, .5 + (i % 3) * .1); hh.scale.setScalar(on ? (1 - cyc) * .9 + .2 : 1); hh.rotation.z = Math.sin(cyc * 5 + i) * .3; });
    tags.forEach((c, i) => pop(c, prog(t, [WT[5][10], WT[5][13]][i] - .2, .4)));
    m.pose(l, { look: -.45, cheer: prog(t, WT[5][8], .3) * .6, ...jump(t, WT[5][14], .4, .35), glow: prog(t, WT[5][8], .3) });
  };
}

// station 6: a realistic timeline — three signposts along a path; the parcel walks it
{
  const s = 6, m = parcel(.85); at(s, m.g, -3.6, 0, 1.2);
  const stops = [['MONTHS 1–3', 'LEARN & TEST', .5, C.butter], ['MONTHS 3–6', 'STEADY SALES', 1.2, C.sky], ['MONTHS 6–12', 'SCALE UP', 2.1, C.teal]];
  const path = box(8, .02, .8, C.cream, .01); at(s, path, 0, .01, 1.2);
  const signs = stops.map(([a, b, hgt, col], i) => {
    const x = -2.6 + i * 2.6, g = new THREE.Group(); at(s, g, x, 0, -.2);
    const p = box(.1, 2.3, .1, '#3A2A1E'); p.position.y = 1.15; g.add(p);
    const off = card(1.6, .8, .03, '#B9B4AA', (c, w, h) => { txt(c, a, w / 2, 24, 17, { family: 'Oswald', weight: 600, color: '#444' }); txt(c, b, w / 2, 56, 20, { color: '#444' }); }, 260);
    const on = card(1.6, .8, .03, col, (c, w, h) => { txt(c, a, w / 2, 24, 17, { family: 'Oswald', weight: 600, color: col === C.teal ? '#E6FFF9' : C.ink }); txt(c, b, w / 2, 56, 20, { color: col === C.teal ? '#fff' : C.ink }); }, 260);
    off.position.set(0, 2.55, .08); on.position.copy(off.position); g.add(off, on);
    const bar = box(.5, hgt, .5, col, .04); bar.geometry.translate(0, hgt / 2, 0); bar.position.set(.45, 0, .5); g.add(bar);
    return { g, off, on, bar, x };
  });
  const note = card(2.4, .36, .02, C.paper, (x, w, h) => txt(x, 'ESTIMATES · YOUR PACE MAY DIFFER', w / 2, h / 2 + 1, 12, { family: 'Oswald', weight: 600, color: '#6B7280' }), 260);
  at(s, note, 0, .45, 2.1); note.rotation.x = -.6;
  builds[6] = (l, t) => {
    const w = prog(l, .3, 6.2), mx = lerp(-3.6, 3.3, w);
    m.g.position.x = s * STEP + mx;
    m.pose(l, { walk: w > 0 && w < 1 ? l * 1.7 : 0, look: w < 1 ? Math.PI / 2 * .35 : 0, cheer: prog(l, 6.6, .3) * .8, glow: .3 + w * .5 });
    signs.forEach((sg, i) => { pop(sg.g, prog(l, .1 + i * .15, .45)); const lit = clamp((mx - sg.x + .5) / .4); sg.on.visible = lit > .5 && sg.g.visible; sg.off.visible = !sg.on.visible && sg.g.visible; sg.bar.scale.set(1, Math.max(.001, eOut(lit)), 1); });
    pop(note, prog(l, 1.2, .4));
  };
  builds[6].camX = l => lerp(-3.4, 3.1, prog(l, .3, 6.2));
}

// station 7: recap — three cards on easels, one per point
{
  const s = 7, m = parcel(.9); at(s, m.g, 0, 0, 1.9);
  const pts = [['1', 'BUY LOW', C.butter], ['2', 'REINVEST IN BULK', C.sky], ['3', 'BUILD A FOLLOWING', C.teal]];
  const cards = pts.map(([n, l, col], i) => { const c = card(1.9, 1.2, .06, col, (x, w, h) => { txt(x, n, w / 2, 40, 44, { color: col === C.teal ? '#fff' : C.coral }); txt(x, l, w / 2, 88, 17, { color: col === C.teal ? '#fff' : C.ink }); }, 230); at(s, c, -2.2 + i * 2.2, 1.65, -.2); c.rotation.x = -.06; post(s, -2.2 + i * 2.2, -.3, 1.4); return c; });
  const head = card(1.8, .5, .04, C.paper, (x, w, h) => txt(x, 'RECAP', w / 2, h / 2 + 2, 26, { family: 'Oswald', weight: 600, color: C.coral }), 260); at(s, head, 0, 3.0, -.3);
  builds[7] = (l, t) => {
    pop(head, prog(l, .05, .4));
    cards.forEach((c, i) => pop(c, prog(t, [WT[7][1], WT[7][3], WT[7][6]][i] - .15, .45)));
    m.pose(l, { look: lerp(-.5, .5, prog(t, WT[7][1], 3)), ...jump(t, WT[7][6] + .3, .45, .35), cheer: prog(t, WT[7][8], .3) * .6 });
  };
}

// station 8: quick check — a question sign, the parcel thinking, a paper question mark
{
  const s = 8, m = parcel(1.1); at(s, m.g, 1.6, 0, 1.3);
  const sign = card(3.4, 1.7, .08, C.paper, (x, w, h) => {
    txt(x, 'QUICK CHECK', w / 2, 34, 22, { family: 'Oswald', weight: 600, color: C.coral });
    txt(x, 'What should you do with', w / 2, 82, 24); txt(x, 'your first profits?', w / 2, 114, 24);
    txt(x, 'Pause and answer before the next lesson', w / 2, 150, 12, { weight: 700, color: '#6B7280' });
  }, 230);
  at(s, sign, -.6, 2.8, -.5); post(s, -.6, -.6, 2.2);
  const qs = new THREE.Shape(); qs.absarc(0, .32, .2, Math.PI, -.4, true); qs.lineTo(.05, .02); qs.lineTo(-.05, .02); qs.lineTo(-.05, .1); qs.absarc(0, .32, .1, -.6, Math.PI, false); qs.lineTo(-.2, .32);
  const q = new THREE.Group(); const qm = shade(new THREE.Mesh(new THREE.ExtrudeGeometry(qs, { depth: .08, bevelEnabled: false }), mat(C.teal))); const dot = box(.1, .1, .08, C.teal, .04); dot.position.set(0, -.12, .04); q.add(qm, dot); at(s, q, 1.6, 2.3, 1.3);
  builds[8] = (l, t) => {
    pop(sign, prog(l, .15, .5));
    grow(q, prog(t, WT[8][2], .4)); q.position.y = 2.3 + Math.sin(l * 2.2) * .08; q.rotation.y = Math.sin(l * 1.4) * .5;
    m.pose(l, { think: prog(t, WT[8][2], .4), look: Math.sin(l * .9) * .35, glow: .4 });
  };
}

// ---------- camera per scene (station-relative), with a little handheld drift ----------
const CAM = [
  l => [V(0, 5.2 - 2.4 * eOut(prog(l, 0, 3)), 15 - 5 * eOut(prog(l, 0, 3))), V(0, 1.5, 0), 10],
  l => [V(.6 - 1.2 * eInOut(prog(l, 0, 6.8)), 2.9, 10.2 - .8 * prog(l, 0, 6.8)), V(0, 1.8, 0), 9.5],
  l => { const x = builds[2].camX(l); return [V(x + .2, 2.8, 10 - .8 * eOut(prog(l, 0, 8))), V(x, 1.7, 0), 9.4]; },
  l => [V(-.2 + .5 * prog(l, 0, 8), 2.8, 9.8 - .9 * eOut(prog(l, 0, 8))), V(.2, 1.8, 0), 9.2],
  l => [V(.5 - .6 * prog(l, 0, 8), 3.0, 10.2 - .8 * eOut(prog(l, 0, 8))), V(.2, 1.6, 0), 9.6],
  l => [V(.2, 2.9, 9.8 - 1 * eOut(prog(l, 0, 8))), V(.3, 2.0, 0), 9.2],
  l => { const x = builds[6].camX(l); return [V(x * .8, 2.7, 9), V(x * .85, 1.6, 0), 8.8]; },
  l => [V(0, 2.8, 9.6 - .6 * eOut(prog(l, 0, 4.6))), V(0, 1.7, 0), 9.4],
  l => [V(.3, 2.7, 8.8 + .8 * eOut(prog(l, 0, 6))), V(0, 1.9, 0), 8.8],
];

function camAt(i, l) {
  const [p, q, f] = CAM[i](l), sx = STATION[i] * STEP;
  p.x += sx; q.x += sx;
  if (WIDE) { q.y += .35; p.sub(q).multiplyScalar(1.28).add(q); }
  const fo = p.distanceTo(q);   // focus on what the camera looks at, so the lesson's text stays sharp   // 16:9 is shorter: step back and aim a little higher
  const h = (a, b) => Math.sin(l * a + b) * .035 + Math.sin(l * a * 2.3 + b * 3) * .015;
  p.x += h(1.1, i); p.y += h(.9, i + 2); q.x += h(.7, i + 5);
  return [p, q, fo];
}

// ---------- overlays ----------
const captions = JSON.parse($('captions').textContent || '[]');
const chunks = [];
captions.forEach(c => {                       // up to 3 words per chunk, each word timed by its share of the characters
  const words = c.text.split(' '), total = c.text.length; let acc = 0;
  const timed = words.map(w => { const t = c.t0 + (acc / total) * (c.t1 - c.t0); acc += w.length + 1; return { w, t }; });
  for (let i = 0; i < timed.length; i += 3) chunks.push({ words: timed.slice(i, i + 3), end: i + 3 < timed.length ? timed[i + 3].t : c.t1 + .35 });
});
const strip = $('strip'), tapes = $('tapes'), lower = $('lower'), caps = $('caps'), cta = $('cta');
const TILT = [-1.6, 1.2, -1, 1.4, -1.3, .9, -1.1, 1.3, -.8];
let lastScene = -1, lastChunk = -2;
function overlays(t, i, local) {
  const sc = SCENES[i];
  if (i !== lastScene) {
    strip.textContent = sc.title;
    lower.innerHTML = sc.lower ? `${sc.lower[0]}<br>${sc.lower[1]}${sc.note ? `<small>${sc.note}</small>` : ''}` : '';
    lastScene = i;
  }
  const sp = prog(local, .02, .42), out = i < SCENES.length - 1 ? prog(local, sc.dur - .22, .22) : 0;
  strip.style.opacity = Math.min(1, sp * 3) * (1 - out); strip.style.transform = `translateY(${(1 - back(sp)) * -50 - out * out * 40}px) rotate(${TILT[i] * back(sp) - out * 3}deg)`;
  const w = strip.offsetWidth;
  tapes.style.transform = strip.style.transform; tapes.style.opacity = strip.style.opacity;
  tapes.innerHTML = `<span class="tape" style="left:${-w / 2 - 34}px;top:-6px;rotate:-24deg"></span><span class="tape" style="left:${w / 2 - 82}px;top:-10px;rotate:20deg"></span>`;
  const lp = sc.lower ? prog(local, .85, .45) * (1 - prog(local, sc.dur - .45, .35)) : 0;
  lower.style.visibility = lp > 0 ? 'visible' : 'hidden'; lower.style.transform = `translateX(${(1 - back(lp)) * -820}px) rotate(-1.2deg)`;
  const ce = 0;
  cta.classList.toggle('hidden', ce <= 0); cta.style.transform = `scale(${.6 + .4 * back(ce)}) rotate(${-1.5 * back(ce)}deg)`;
  const k = chunks.findIndex(c => t >= c.words[0].t - .05 && t < c.end);
  if (k !== lastChunk) { caps.innerHTML = k < 0 ? '' : chunks[k].words.map((x, j) => `<span class="word" style="rotate:${[-2.5, 1.8, -1.2][j]}deg">${x.w}</span>`).join(''); lastChunk = k; }
  if (k >= 0) [...caps.children].forEach((el, j) => { const p = prog(t, chunks[k].words[j].t - .04, .18); el.style.opacity = p > 0 ? 1 : 0; el.style.transform = `translateY(${(1 - eOut(p)) * 26}px) scale(${.85 + .15 * back(p)})`; });
}

// ---------- one clock ----------
const tmpF = new THREE.Vector3();
function seek(t) {
  t = clamp(t, 0, DUR - 1e-4);
  const i = SCENES.findLastIndex(s => t >= s.at), local = t - SCENES[i].at;
  for (let k = 0; k < builds.length; k++) if (k !== i && STATION[k] !== STATION[i]) { /* other stations keep their last pose; they're off camera */ }
  builds[i](local, t);
  let [p, q, f] = camAt(i, local), blur = 0;
  if (i > 0 && local < WHIP) {                   // whip from the previous scene's last frame to this scene's framing
    const pi = i - 1, [p0, q0, f0] = camAt(pi, SCENES[pi].dur), [p1, q1, f1] = camAt(i, WHIP), e = eInOut(local / WHIP);
    if (STATION[pi] !== STATION[i]) { p = p0.clone().lerp(p1, e); q = q0.clone().lerp(q1, e); f = lerp(f0, f1, e); blur = Math.sin(Math.PI * local / WHIP); }
  }
  camera.position.copy(p); camera.lookAt(q);
  if (i > 0 && STATION[i - 1] !== STATION[i]) {
    const w = local / WHIP, settle = prog(local, WHIP, .5);
    camera.rotateZ(local < WHIP ? Math.sin(w * Math.PI) * .07 : -Math.sin(settle * Math.PI) * (1 - settle) * .012);
  }
  placeLights(Math.round(camera.position.x / STEP) * STEP);
  dust.material.opacity = .45 + Math.sin(t * 1.7) * .1; dust.position.y = Math.sin(t * .3) * .2;
  canvas.style.filter = blur > .02 ? `blur(${(blur * 9).toFixed(1)}px)` : 'none';
  if (composer) { bokeh.uniforms.focus.value = f; composer.render(); } else renderer.render(scene, camera);
  overlays(t, i, local);
}

// ---------- player ----------
const stage = $('stage'), frame = $('frame');
const fit = () => { stage.style.transform = `scale(${frame.clientWidth / W})`; };
new ResizeObserver(fit).observe(frame); fit();
const audio = new Audio(); let hasAudio = false;
const b64 = ($('soundtrack').textContent || '').trim();
if (!RENDER && b64.length > 100) { const bin = atob(b64), u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i); audio.src = URL.createObjectURL(new Blob([u8], { type: 'audio/mpeg' })); hasAudio = true; }
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
let T = 0, playing = false, last = 0;
function paint() { $('fill').style.transform = `scaleX(${T / DUR})`; $('time').textContent = `${fmt(T)} / ${fmt(DUR)}`; }
function play() { if (T >= DUR - .05) T = 0; playing = true; last = performance.now(); $('cover').classList.add('hidden'); if (hasAudio) { audio.currentTime = T; audio.play().catch(() => { hasAudio = false; }); } $('play').textContent = '❚❚'; requestAnimationFrame(tick); }
function pause() { playing = false; if (hasAudio) audio.pause(); $('play').textContent = '▶'; }
function tick(now) { if (!playing) return; if (hasAudio && !audio.paused && audio.readyState >= 2) T = audio.currentTime; else T += (now - last) / 1000; last = now; if (T >= DUR) { T = DUR; pause(); } seek(T); paint(); if (playing) requestAnimationFrame(tick); }
$('play').onclick = () => playing ? pause() : play(); $('bigplay').onclick = play;
$('sound').onclick = () => { audio.muted = !audio.muted; $('sound').textContent = audio.muted ? '♪ OFF' : '♪ ON'; };
$('track').onclick = e => { const r = e.currentTarget.getBoundingClientRect(); T = clamp((e.clientX - r.left) / r.width) * DUR; if (hasAudio) audio.currentTime = T; seek(T); paint(); };
document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); } });

if (RENDER) { document.body.classList.add('render'); $('cover').classList.add('hidden'); window.__seek = t => seek(t); window.__duration = DUR; }
seek(1.2); paint();
window.__ready = true;
</script>
</body>
