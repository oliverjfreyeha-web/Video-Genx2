.chip{font-family:Inter;font-weight:700;font-size:17px;letter-spacing:.08em;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.55);color:#8D93A8;display:flex;align-items:center;gap:7px}

  box-shadow:0 16px 36px rgba(30,34,53,.14),0 2px 6px rgba(30,34,53,.06);color:var(--ink)}

<script>
(async function(){
'use strict';
const Q = new URLSearchParams(location.search);

const WIDE = Q.get('aspect') === '16x9';

/* ---------------- math / easing ---------------- */
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));

function bezier(x1, y1, x2, y2) {

}

  const b = {
    g, x, y, z, w, d, h, color,
    top: mk([[x, y, z + h], [x + w, y, z + h], [x + w, y + d, z + h], [x, y + d, z + h]]),
    left: mk([[x, y + d, z], [x + w, y + d, z], [x + w, y + d, z + h], [x, y + d, z + h]]),
    right: mk([[x + w, y, z], [x + w, y + d, z], [x + w, y + d, z + h], [x + w, y, z + h]]),

}

function shadow(parent, x, y, w, d, h, op = 1) {

}

/* ---------------- icons (24px box, stroke) ---------------- */
const ICON = {
  chat: ['M4 5h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H10l-5 4v-4H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z'],
  phone: ['M6.6 3.2h2.8l1.4 4.2-2.1 1.4a12 12 0 0 0 6.5 6.5l1.4-2.1 4.2 1.4v2.8a2 2 0 0 1-2.2 2A17.5 17.5 0 0 1 4.6 5.4a2 2 0 0 1 2-2.2z'],
  check: ['M5 12.5l4.5 4.5L19 7.5'],
  list: ['M4 6.5l1.6 1.6L8.4 5.2', 'M4 12.5l1.6 1.6 2.8-2.9', 'M4 18.5l1.6 1.6 2.8-2.9', 'M11.5 7h8.5', 'M11.5 13h8.5', 'M11.5 19h6'],
  cal: ['M5 5.5h14a1.5 1.5 0 0 1 1.5 1.5v12a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 19V7A1.5 1.5 0 0 1 5 5.5z', 'M3.5 10.5h17', 'M8 3v4', 'M16 3v4'],
  clip: ['M7 4.5h10a1.5 1.5 0 0 1 1.5 1.5v14A1.5 1.5 0 0 1 17 21.5H7A1.5 1.5 0 0 1 5.5 20V6A1.5 1.5 0 0 1 7 4.5z', 'M9.5 3h5v3h-5z', 'M8.8 11h6.4', 'M8.8 15h4.5'],
  bell: ['M6 16.5V11a6 6 0 0 1 12 0v5.5l1.6 2H4.4z', 'M10 21a2 2 0 0 0 4 0'],
  clock: ['M12 4a8 8 0 1 1 0 16a8 8 0 1 1 0-16z', 'M12 8v4.3l2.8 1.8'],
  pause: ['M9 6v12', 'M15 6v12'],
  x: ['M7 7l10 10', 'M17 7L7 17'],
  bang: ['M12 5v9', 'M12 18.5v.5'],
};
function icon(parent, name, color = '#fff', sw = 2.4, size = 24, cx = 0, cy = 0) {
  const s = size / 24;
  const g = el('g', { transform: `translate(${cx - size / 2},${cy - size / 2}) scale(${s})`, fill: 'none', stroke: color, 'stroke-width': sw, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, parent);
  for (const d of ICON[name]) el('path', { d }, g);

}

/* ---------------- fonts ---------------- */
await Promise.all([
  document.fonts.load('700 40px "Space Grotesk"'), document.fonts.load('600 20px Inter'), document.fonts.load('700 20px Inter')
]);
await document.fonts.ready;

/* ---------------- layout ---------------- */
const LAY = WIDE ? {
  route: [[-7.5, 0], [3, 0], [3, -7], [9, -7], [9, -11.5], [8.15, -11.5]],
  stub: [[9, -11.5], [9, -15.7]],
  tower: [-2, -2.3], gate: [3, -3.5], board: [0.8, -4.6, 0.2, 2.2],
  sched: [5.2, -9.7, 2.2, 1.6], house: [5.9, -12.6, 2.0, 2.2],
  vanFrom: -15.6, vanTo: -12.75,
} : {
  route: [[-7.5, 0], [3, 0], [3, 7], [9, 7], [9, 11.5], [8.15, 11.5]],
  stub: [[9, 11.5], [9, 15.7]],
  tower: [-2, -2.3], gate: [3, 3.5], board: [0.8, 2.4, 0.2, 2.2],
  sched: [5.2, 4.3, 2.2, 1.6], house: [5.9, 10.4, 2.0, 2.2],
  vanFrom: 15.6, vanTo: 12.75,
};
function mkPath(p) {
  const segs = []; let acc = 0;
  for (let i = 0; i < p.length - 1; i++) {
    const a = p[i], b = p[i + 1], L = Math.hypot(b[0] - a[0], b[1] - a[1]);

/* ---------------- SVG skeleton ---------------- */
const svg = document.getElementById('world');
svg.setAttribute('width', SW); svg.setAttribute('height', SH); svg.setAttribute('viewBox', `0 0 ${SW} ${SH}`);
const defs = el('defs', null, svg);
defs.innerHTML = `

    const x = ((c.x * SW + cm.tx * 0.18 + t * (8 + i * 2)) % (SW + 400) + SW + 400) % (SW + 400) - 200;
    const y = c.y * SH + cm.ty * 0.1;
    c.g.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)}) scale(${c.s})`);
  });

  /* station lit levels */
  const END = eSoft(prog(t, 31.8, 32.8));
  const LV = {
    R: Math.max(eSoft(prog(t, 9.25, 9.85)), END),
    Q: Math.max(eSoft(prog(t, 15.2, 15.8)), END),
    S: Math.max(eSoft(prog(t, 21.2, 21.8)), END),
    E: Math.max(eSoft(prog(t, 27.0, 27.6)), END),
  };
  for (const k in lit) for (const b of lit[k]) {
    const c = mix(dimOf(b.color), b.color, LV[k]);
    if (b.roof) { paintRoof(b, c); b.tri.setAttribute('fill', shades(mix(dimOf(hWalls.color), hWalls.color, LV.E)).left); }
    else paint(b, c);
  }
  // windows
  towerWin.forEach((w, i) => {
    const st = i < 29 ? 'R' : 'S';
    const blink = Math.sin(t * (0.9 + (i % 5) * 0.23) + i * 1.7) > -0.55 ? 1 : 0.35;
    w.setAttribute('fill', mix('#9DA3B8', mix(C.sun, '#fff', 0.35), LV[st] * blink));
  });
  houseWin.forEach((w, i) => w.setAttribute('fill', mix('#A6ABBD', mix(C.sun, '#fff', 0.2), LV.E)));

  /* road health front */
  let H = sR - 0.85;
  H = lerp(H, sQ + 0.7, eSoft(prog(t, 11.0, 12.2)));
  H = lerp(H, sS + 0.6, eSoft(prog(t, 16.7, 17.8)));
  H = lerp(H, sE + 1, eSoft(prog(t, 23.2, 24.3)));
  H = Math.max(H, lerp(-1, sE + 1, END));
  const flowOn = t > 2.6;
  for (const tl of tiles) {
    let hlt = 1;
    if (tl.kind === 'main') hlt = clamp((H - (tl.s0 + tl.s1) / 2) / 0.9 + 0.5);
    if (tl.kind === 'branch') hlt = 1;
    const c = tl.kind === 'main' ? mix(ROADX, tl.col, hlt) : tl.col;
    paint(tl.b_, c);
    if (tl.dash) {
      tl.dash.setAttribute('stroke-dashoffset', (tl.s0 * U - t * 75).toFixed(1));
      tl.dash.setAttribute('opacity', (hlt * (flowOn ? 0.95 : 0.6)).toFixed(2));
    }
    if (tl.crack) tl.crack.setAttribute('opacity', (1 - hlt).toFixed(2));
  }

  /* checklist + gate */
  const tickT = [15.72, 16.12, 16.52];
  ticks.forEach((tk, i) => {
    const k = eOut(prog(t, tickT[i], tickT[i] + 0.35)), kk = Math.max(k, END);
    if (!tk._len) tk._len = tk.getTotalLength();
    tk.setAttribute('stroke-dasharray', tk._len); tk.setAttribute('stroke-dashoffset', (tk._len * (1 - kk)).toFixed(2));
    checkBoxes[i].setAttribute('fill', mix('#FFFFFF', mix(C.mint, '#fff', 0.75), kk));
    checkBoxes[i].setAttribute('stroke', mix('#C5C9D6', C.mint, kk));
  });
  // gate strip: white -> mint when open; coral flash when rejecting non-fit
  let gateC = mix('#FFFFFF', C.mint, Math.max(eSoft(prog(t, 16.6, 16.9)), END));
  const ns = storyState(NONFIT, t);
  const rej = t > T3 && t < 21 ? Math.max(0, 1 - Math.abs((ns.br ? ns.s : ns.s - sB) - 0.1) / 0.7) : 0;
  if (rej > 0) gateC = mix(gateC, C.coral, rej);
  gateStrip.setAttribute('fill', gateC);

  /* slots */
  slotEls.forEach((sl, i) => {
    const p0 = pop(t, 21.55 + i * 0.22, 0.5);
    const show = Math.max(p0.k, END);
    const s = END > p0.k ? 1 : p0.s;
    sl.sg.setAttribute('opacity', clamp(Math.max(p0.o, END)).toFixed(3));
    sl.sg.setAttribute('transform', `translate(${sl.cx},${sl.cy}) scale(${s.toFixed(3)}) translate(${-sl.cx},${-sl.cy})`);
    const picked = eOut(prog(t, 22.75, 23.05));
    if (i === 0) {
      const pc = Math.max(picked, END);
      sl.r.setAttribute('fill', mix(mix(C.indigo, '#fff', 0.88), C.mint, pc));
      sl.r.setAttribute('stroke', mix(mix(C.indigo, '#fff', 0.55), mix(C.mint, C.ink, 0.2), pc));
      sl.tx.setAttribute('fill', mix(C.ink, '#fff', pc));
      sl.ck.setAttribute('opacity', 0); sl.ci.setAttribute('opacity', pc.toFixed(2));
      const bump = 1 + 0.06 * Math.sin(Math.PI * prog(t, 22.75, 23.15));
      sl.inner.setAttribute('transform', `translate(${sl.cx},${sl.cy}) scale(${bump.toFixed(3)}) translate(${-sl.cx},${-sl.cy})`);
    } else {
      sl.inner.setAttribute('opacity', (1 - 0.55 * Math.max(picked, END)).toFixed(2));
    }
  });

  /* ---- cubes ---- */
  const dyn = [];
  story.forEach((cb, k) => {
    const st = storyState(k, t);
    if (st.o <= 0.001 || t > 31.5) { cb.g.setAttribute('opacity', 0); cb._depth = -1e9; return; }
    let p, x, y;
    if (st.br) { p = at(BR, st.s); x = p.x; y = p.y; }
    else { p = at(ROUTE, st.s); x = p.x + p.fx * st.lat; y = p.y + p.fy * st.lat; }
    const stalled = eSoft(prog(t, 4.45, 5.0)) * (1 - eSoft(prog(t, 10.95, 11.4)));
    const bob = (0.035 + 0.035 * Math.sin(t * 5.2 + k * 1.3)) * (1 - stalled) + (st.br ? 0 : 0);
    const pingS = st.br ? null : st.s;
    placeCube(cb, x, y, st.z + bob, st.scale, st.o, cubeColor(k, t, st.s, st.br), t > T2 ? pingS : null);
    dyn.push(cb);
  });
  stream.forEach((cb, j) => {
    const sp = 23.4 + j * 0.52, life = t - sp;
    const vis = prog(t, 31.35 + (j % 6) * 0.05, 31.85 + (j % 6) * 0.05);
    const nf = j % 7 === 3;
    let u = life * 3.6;
    if (vis <= 0 || u < 0) { cb.g.setAttribute('opacity', 0); cb._depth = -1e9; return; }
    let x, y, s = u, onBr = false, o = vis, sc = 1, z = 0;
    const drop = prog(life, 0, 0.4); z = (1 - eOut(drop)) * 1.4; o *= clamp(life / 0.12); sc = lerp(0.92, 1, eOut(drop));
    if (nf && u > sB) { onBr = true; s = Math.min(u - sB, BR.len - 0.3); o *= 1 - clamp((u - sB - BR.len + 0.3) / 0.8); }
    if (!onBr) { const inside = clamp((u - (sE - 0.45)) / 0.55); o *= 1 - inside; sc *= 1 - 0.35 * inside; }
    if (o <= 0.001) { cb.g.setAttribute('opacity', 0); cb._depth = -1e9; return; }
    const p = onBr ? at(BR, s) : at(ROUTE, s); x = p.x; y = p.y;
    let col = C.coral;
    if (onBr) col = mix(C.coral, GREY, clamp(s / 0.7)); else col = mix(C.coral, C.mint, clamp((s - sQ) / 0.45));
    placeCube(cb, x, y, z + 0.035 + 0.035 * Math.sin(t * 5.2 + j), sc, o, col, onBr ? null : s);
    dyn.push(cb);
  });
  // van
  const vk = eOut(prog(t, 28.15, 29.55)), vo = clamp((t - 28.15) / 0.3) * (t < 31.4 ? 1 : 0) + (END > 0 ? END : 0);
  const vanK = Math.max(vk, END);
  if (Math.max(vo, END) > 0.001) {
    const vy = lerp(LAY.vanFrom, LAY.vanTo, vanK);
    const vp = P(9, vy, 0);
    const bounce = (1 - vanK) * Math.abs(Math.sin(t * 22)) * 0.025;
    VAN.g.setAttribute('transform', `translate(${vp[0].toFixed(1)},${vp[1].toFixed(1)})`);
    VAN.body.setAttribute('transform', `translate(0,${(-bounce * U).toFixed(1)})`);
    VAN.g.setAttribute('opacity', clamp(Math.max(vo, END)).toFixed(3));
    VAN._depth = 9 + vy; dyn.push(VAN);
  } else VAN.g.setAttribute('opacity', 0);
  dyn.sort((a, b) => a._depth - b._depth);
  let ordered = true; const kids = L_dyn.children;
  for (let i = 0; i < dyn.length; i++) if (kids[i] !== dyn[i].g) { ordered = false; break; }
  if (!ordered) dyn.forEach(d => L_dyn.appendChild(d.g));

  /* ---- billboards ---- */
  const tagShow = 1 - eSoft(prog(t, 0, 0.01)) * 0; // always present
  [['R', tagR], ['Q', tagQ], ['S', tagS], ['E', tagE]].forEach(([k, tg], i) => {
    const appear = pop(t, 0.35 + i * 0.07, 0.55);
    const lv = LV[k];
    const litPop = { R: 9.25, Q: 15.2, S: 21.2, E: 27.0 }[k];
    const bump = 1 + 0.12 * Math.sin(Math.PI * prog(t, litPop, litPop + 0.45));
    tg.circ.setAttribute('fill', mix('#A9AEBE', tg.color, lv));
    tg.rect.setAttribute('fill', mix('#6B7086', C.ink, lv));
    let ringO = 0;
    if (k === 'E') { const r = prog(t, 6.55, 7.6); ringO = Math.sin(Math.PI * r) * (r > 0 && r < 1 ? 1 : 0); }
    tg.ring.setAttribute('opacity', ringO.toFixed(2));
    bbPlace(tg, tagPos[k], BS * appear.s * bump, appear.o);
  });
  // first message
  { const p = pop(t, 5.55, 0.5, 8.35); bbPlace(firstMsg, firstAt, BS * p.s, p.o); }
  // stalled sign
  {
    const p = pop(t, 4.7, 0.55, 11.15);
    const wob = Math.sin((t - 4.7) * 9) * 7 * Math.exp(-Math.max(0, t - 4.7) * 2.2) * (t > 4.7 ? 1 : 0);
    bbPlace(stallSign, stallAt, BS * p.s, p.o, ` rotate(${wob.toFixed(2)})`);
    stallSign.inner.setAttribute('transform', `translate(0,${(-10 * (1 - eOut(p.k))).toFixed(1)})`);
  }
  // reply effects
  {
    const p = pop(t, 9.75, 0.5, 14.0);
    bbPlace(timerFlag, [flagAt[0] + 70, flagAt[1] - 6], BS * p.s, p.o);
    const bk = eOut(prog(t, 10.4, 11.0)), bo = clamp(bk * 1.5) * (1 - eSoft(prog(t, 13.6, 14.0)));
    const from = P(tx + 0.6, ty, 2.4);
    const off = WIDE ? [170, -40] : [120, -170];
    bbPlace(replyBubble, [from[0] + off[0] * bk * BS, from[1] + off[1] * bk * BS], BS * lerp(0.6, 1, bk), bo);
    const pp = pop(t, 10.85, 0.45, 14.0);
    const phAt = P(tx - 0.2, ty + 0.9, 2.1);
    const phPos = WIDE ? [phAt[0] - 190, phAt[1] - 40] : [phAt[0] - 150, phAt[1] - 40];
    bbPlace(phone, phPos, BS * pp.s, pp.o);
    phone.rings.forEach((r, i) => {
      const ph = ((t - 10.85) / 0.9 + i / 3); const f = ph - Math.floor(ph);
      const on = t > 10.85 && t < 13.9 ? 1 : 0;
      r.setAttribute('r', (32 + 46 * f).toFixed(1)); r.setAttribute('opacity', (on * (1 - f) * 0.8).toFixed(2));
    });
    const shake = t > 10.85 && t < 12.6 ? Math.sin(t * 40) * 9 * (Math.sin(t * 6) > 0 ? 1 : 0.2) : 0;
    phone.ic.setAttribute('transform', `rotate(${shake.toFixed(1)}) translate(-15,-15) scale(1.25)`);
    const bo2 = LV.R * (0.55 + 0.45 * Math.sin(t * 3.2));
    beacon.setAttribute('cx', beaconAt[0]); beacon.setAttribute('cy', beaconAt[1]); beacon.setAttribute('opacity', bo2.toFixed(2));
    beacon.setAttribute('r', (55 * BS).toFixed(1));
  }
  // qualify effects
  {
    const p = pop(t, 19.0, 0.5, 20.4);
    bbPlace(notFit, notFitAt, BS * p.s, p.o);
  }
  // schedule effects
  {
    const tp = pop(t, 21.45, 0.5, 23.0);
    bbPlace(twoTimes, [pinTarget[0] - 10, pinTarget[1] - 110], BS * 0.95 * tp.s, tp.o * 0);
    const k = prog(t, 22.95, 23.5);
    const fall = 1 - backOut(k);
    const o = clamp(k * 4) * (1 - eSoft(prog(t, 26.2, 26.5))) + END * 0;
    const target = [pinTarget[0] + 54, pinTarget[1] + 4];
    bbPlace(pin, target, BS, o);
    pin.inner.setAttribute('transform', `translate(0,${(-150 * fall).toFixed(1)})`);
    pin.sh.setAttribute('rx', (18 * (0.5 + 0.5 * k)).toFixed(1));
    const rp = prog(t, 23.3, 24.0);
    pin.rip.setAttribute('rx', (24 + 50 * rp).toFixed(1)); pin.rip.setAttribute('ry', (10 + 20 * rp).toFixed(1));
    pin.rip.setAttribute('opacity', (rp > 0 && rp < 1 ? (1 - rp) : 0).toFixed(2));
  }
  // estimate effects
  {
    const hp = P(hx + hw / 2, hy + hd / 2, 1.6);
    const cpop = pop(t, 27.1, 0.5, 31.6);
    const cOff = WIDE ? [250, -200] : [-170, -160];
    bbPlace(confirmB, [hp[0] + cOff[0] * BS, hp[1] + cOff[1] * BS], BS * cpop.s, cpop.o);
    const bpop = pop(t, 27.65, 0.5, 31.6);
    const bOff = WIDE ? [330, -120] : [-150, -60];
    bbPlace(bell, [hp[0] + bOff[0] * BS, hp[1] + bOff[1] * BS], BS * bpop.s, bpop.o);
    const ring = t > 27.7 ? Math.sin((t - 27.7) * 18) * 20 * Math.exp(-(t - 27.7) * 2.4) : 0;
    bell.swing.setAttribute('transform', `translate(${bell.bx},0) rotate(${ring.toFixed(1)} 0 -10)`);
    bell.arcs.setAttribute('opacity', (Math.abs(ring) / 14).toFixed(2));
    const bk = pop(t, 29.55, 0.55, 31.6);
    const bkOff = WIDE ? [40, -210] : [0, -245];
    bbPlace(booked, [hp[0] + bkOff[0] * BS, hp[1] + bkOff[1] * BS], BS * bk.s, bk.o * 0);
    // house glow when cubes enter
    let gl = 0; story.forEach((cb, k) => { if (k === NONFIT) return; const s = storyState(k, t).s; if (t > T5) gl = Math.max(gl, Math.exp(-Math.pow((s - sE) / 0.35, 2))); });
    gl = Math.max(gl, LV.E * 0.35 * (t > 27 ? 1 : 0));
    houseGlow.setAttribute('cx', doorPt[0]); houseGlow.setAttribute('cy', doorPt[1]); houseGlow.setAttribute('opacity', gl.toFixed(2));
  }

  /* ---- HTML overlays ---- */
  // title card
  {
    const a = eOut(prog(t, 0.05, 0.6)), b = eSoft(prog(t, 2.3, 2.8));
    const base = WIDE ? 'translate(-50%,-50%) ' : '';
    titleEl.style.transform = `${base}translateY(${(24 * (1 - a) - 40 * b).toFixed(1)}px) scale(${(0.96 + 0.04 * a).toFixed(3)})`;
    titleEl.style.opacity = (a * (1 - b)).toFixed(3);
    titleEl.style.display = t > 2.85 ? 'none' : '';
    titleSpans.forEach((s, i) => {
      const k = eOut(prog(t, TW[i].t - 0.05, TW[i].t + 0.3));
      s.style.opacity = (0.16 + 0.84 * k).toFixed(3); s.style.transform = `translateY(${(14 * (1 - k)).toFixed(1)}px)`;
    });
  }
  // beat label + chips
  {
    let bi = -1; BEATS.forEach((b, i) => { if (t >= b.t0 - 0.05 && t < b.t1 + 0.4) bi = i; });
    if (bi !== curBeat) {
      curBeat = bi;
      if (bi >= 0) { const b = BEATS[bi]; badgeEl.textContent = b.badge; badgeEl.style.background = b.color; labelTxt.innerHTML = b.html; }
    }
    if (bi >= 0) {
      const b = BEATS[bi];
      const a = eOut(prog(t, b.t0, b.t0 + 0.55)), z = eSoft(prog(t, b.t1 - 0.05, b.t1 + 0.3));
      labelEl.style.transform = `translateX(-50%) translateY(${(-26 * (1 - a) - 18 * z).toFixed(1)}px) scale(${(0.95 + 0.05 * a).toFixed(3)})`;
      labelEl.style.opacity = (a * (1 - z)).toFixed(3);
      badgeEl.style.transform = `scale(${(0.8 + 0.2 * backOut(prog(t, b.t0 + 0.08, b.t0 + 0.6))).toFixed(3)})`;
    } else labelEl.style.opacity = 0;
    const ca = eOut(prog(t, 2.75, 3.3)) * (1 - eSoft(prog(t, 31.55, 31.95)));
    chipsEl.style.opacity = ca.toFixed(3);
    chipsEl.style.transform = `translateX(-50%) translateY(${(-12 * (1 - ca)).toFixed(1)}px)`;
    const active = bi >= 0 ? BEATS[bi].chip : -1;
    CHIPS.forEach((c, i) => {
      const done = i < active, on = i === active;
      c.style.background = on ? '#fff' : done ? 'rgba(255,255,255,.8)' : 'rgba(255,255,255,.5)';
      c.style.color = on ? C.ink : done ? mix(C.mint, C.ink, 0.35) : '#8D93A8';
      c.firstChild.style.background = on ? CHIPCOL[i] : done ? C.mint : '#B9BECC';
      c.style.boxShadow = on ? '0 6px 16px rgba(30,34,53,.12)' : 'none';
    });
  }
  // captions
  {
    let line = null; for (const ln of LINES) if (ln.li > 0 && t >= ln.t0 - 0.12 && t < ln.t1 + 0.55) line = ln;
    if (!line) { capEl.style.opacity = 0; capKey = ''; }
    else {
      let ci = 0; line.chunks.forEach((ch, i) => { if (t >= ch[0].t - 0.12) ci = i; });
      const ch = line.chunks[ci], key = line.li + ':' + ci;
      if (key !== capKey) { capKey = key; capEl.innerHTML = ch.map(w => `<span>${w.w}</span>`).join(''); }
      const spans = capEl.children;
      let cur = -1; ch.forEach((w, i) => { if (t >= w.t - 0.04) cur = i; });
      if (t > line.t1 + 0.05) cur = -1;
      ch.forEach((w, i) => {
        const k = eOut(prog(t, w.t - 0.06, w.t + 0.18));
        spans[i].style.opacity = k.toFixed(3);
        spans[i].style.transform = `translateY(${(10 * (1 - k)).toFixed(1)}px)`;
        spans[i].style.color = i === cur ? C.coral : C.ink;
      });
      const a = eOut(prog(t, ch[0].t - 0.12, ch[0].t + 0.2)), z = eSoft(prog(t, line.t1 + 0.25, line.t1 + 0.55));
      capEl.style.opacity = (Math.max(a, ci > 0 ? 1 : a) * (1 - z)).toFixed(3);
      capEl.style.transform = `translateX(-50%) translateY(${(8 * (1 - a) + 8 * z).toFixed(1)}px) scale(${(0.97 + 0.03 * Math.max(a, ci > 0 ? 1 : 0)).toFixed(3)})`;
    }
  }
  // end card
  {
    const a = eOut(prog(t, 32.35, 33.0));
    const base = WIDE ? 'translateX(-50%) ' : '';
    endEl.style.opacity = a.toFixed(3);
    endEl.style.transform = `${base}translateY(${(40 * (1 - a)).toFixed(1)}px) scale(${(0.96 + 0.04 * a).toFixed(3)})`;
    endEl.style.display = t < 32.2 ? 'none' : '';
    endParts.forEach((p, i) => {
      const k = eOut(prog(t, 32.55 + i * 0.12, 33.15 + i * 0.12));
      let s = 0.94 + 0.06 * backOut(k);
      if (i === 1) s *= 1 + 0.035 * Math.sin(Math.PI * prog(t, 34.6, 35.3)) + 0.035 * Math.sin(Math.PI * prog(t, 35.3, 36.0));
      p.style.opacity = k.toFixed(3); p.style.transform = `translateY(${(16 * (1 - k)).toFixed(1)}px) scale(${s.toFixed(3)})`;
    });
  }
}

/* ---------------- player / render hooks ---------------- */
function fit() {
  if (RENDER) { stage.style.transform = 'none'; return; }
  const wrap = document.getElementById('wrap'), W = wrap.clientWidth, H = wrap.clientHeight;
  const s = Math.min(W / SW, H / SH) * 0.96;
  stage.style.transform = `scale(${s})`;
  stage.style.left = ((W - SW * s) / 2) + 'px'; stage.style.top = ((H - SH * s) / 2) + 'px';
}
fit(); addEventListener('resize', fit);
let T = +(Q.get('t') || 0), playing = false, last = 0;
seek(T);
if (RENDER) {
  window.__duration = DUR;
  window.__seek = t => { T = t; seek(t); };
} else {
  const btn = $('play'), fill = $('fill'), time = $('time'), bar = $('bar');
  const ui = () => { fill.style.width = (T / DUR * 100) + '%'; time.textContent = T.toFixed(2) + ' / ' + DUR.toFixed(2); btn.textContent = playing ? 'Pause' : 'Play'; };
  const toggle = () => { playing = !playing; if (playing && T >= DUR) T = 0; last = performance.now(); ui(); };
  btn.onclick = toggle;
  addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); toggle(); } });
  bar.onclick = e => { const r = bar.getBoundingClientRect(); T = clamp((e.clientX - r.left) / r.width) * DUR; seek(T); ui(); };
  const loop = now => {
    if (playing) { T += (now - last) / 1000; if (T >= DUR) { T = DUR; playing = false; } seek(T); ui(); }
    last = now; requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop); ui();
}
})();
</script>
</body>
