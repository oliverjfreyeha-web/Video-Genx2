<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Follow-up Workflow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ind:#4F46E5; --ind50:#EEF2FF; --ind100:#E0E7FF; --ind200:#C7D2FE;
  --grn:#16A34A; --grn50:#F0FDF4; --amb:#F59E0B; --amb50:#FFFBEB;
  --sl:#64748B; --ink:#0F172A; --ink2:#334155; --bd:#E5E7EB; --line:#EEF0F3;
  --sh:0 1px 2px rgba(0,0,0,.05),0 12px 32px -12px rgba(15,23,42,.18);
  --shl:0 1px 2px rgba(0,0,0,.05),0 12px 32px -12px rgba(15,23,42,.18),0 40px 80px -30px rgba(15,23,42,.22);
  --mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#DCE0E7;font-family:Inter,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
#frame{position:absolute;left:50%;top:calc(50% - 28px);transform:translate(-50%,-50%)}
#stage{position:absolute;left:0;top:0;overflow:hidden;transform-origin:0 0;background:linear-gradient(180deg,#EEF0F4 0%,#F7F8FA 100%)}
body.render{background:#EEF0F4}
body.render #frame{left:0;top:0;transform:none}
body.render #controls{display:none}
.abs{position:absolute}
#bg{position:absolute;inset:0}
#bg svg{position:absolute;inset:0;width:100%;height:100%}
#world{position:absolute;left:0;top:0;transform-origin:0 0}

/* ---------- window ---------- */
#win{position:absolute;background:#fff;border:1px solid var(--bd);border-radius:16px;box-shadow:var(--shl);overflow:hidden}
.tbar{height:44px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 16px;background:#FBFBFC;position:relative}
.dots{display:flex;gap:8px}
.dots i{width:12px;height:12px;border-radius:50%;display:block;background:#E2E8F0;border:1px solid #D9DEE6}
.tbar .wt{position:absolute;left:0;right:0;text-align:center;font-size:13px;font-weight:500;color:var(--sl);pointer-events:none}
.tbar .live{position:absolute;right:16px;top:12px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--grn)}
.tbar .live b{width:7px;height:7px;border-radius:50%;background:var(--grn);display:block}
.side{position:absolute;left:0;top:44px;bottom:0;background:#F8FAFC;border-right:1px solid var(--line);padding:16px 12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:-.01em;margin:2px 4px 22px}
.lmark{width:30px;height:30px;border-radius:9px;background:linear-gradient(160deg,#6366F1,#4338CA);display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 2px 6px -2px rgba(79,70,229,.6);flex:none}
.nav{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:9px;font-size:14px;font-weight:500;color:#475569;margin-bottom:2px}
.nav svg{flex:none;color:#94A3B8}
.nav.on{background:#fff;color:var(--ind);box-shadow:0 1px 2px rgba(15,23,42,.06),0 0 0 1px var(--bd)}
.nav.on svg{color:var(--ind)}
.side.mini .nav{justify-content:center;padding:0}
.side.mini .logo{justify-content:center;margin:2px 0 22px}
.sfoot{position:absolute;left:12px;right:12px;bottom:14px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--ink2)}
.sfoot small{display:block;font-weight:400;color:var(--sl);font-size:12px}
.av{border-radius:50%;display:grid;place-items:center;font-weight:600;color:#fff;flex:none}
.main{position:absolute;top:44px;right:0;bottom:0}
.hdr{position:absolute;left:0;right:0;top:0;height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:12px;background:#fff}
.hdr h1{font-size:18px;font-weight:600;letter-spacing:-.01em}
.hdr .sub{font-size:13px;color:var(--sl);margin-top:2px}
.hdr .sp{flex:1}
.hv{position:relative}
.hv::after{content:"";position:absolute;inset:-1px;border-radius:inherit;background:rgba(79,70,229,.045);box-shadow:0 0 0 3px rgba(79,70,229,.12);opacity:var(--hv,0);pointer-events:none}
.pill{height:36px;border:1px solid var(--bd);border-radius:10px;display:flex;align-items:center;gap:8px;padding:0 10px;font-size:14px;font-weight:500;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04)}
#lead{width:150px;overflow:hidden}
#lead .lv{position:absolute;left:10px;top:0;height:34px;display:flex;align-items:center;gap:8px;white-space:nowrap}
#lead .car{position:absolute;right:10px;top:10px;color:#94A3B8}
#day{width:124px;background:#F8FAFC;font-family:var(--mono);font-size:14px;overflow:hidden}
#day .dv{position:absolute;left:34px;top:0;height:34px;line-height:34px;font-weight:500}
#day .di{position:absolute;left:10px;top:9px;color:var(--ind)}
#day .dn{position:absolute;right:9px;top:9px;color:#94A3B8}
.tog{display:flex;align-items:center;gap:10px;height:36px;padding:0 4px 0 12px;border-radius:10px}
.tog .tl{position:relative;width:52px;height:20px;font-size:14px;font-weight:600}
.tog .tl span{position:absolute;right:0;top:0}
.track{width:44px;height:26px;border-radius:13px;background:#CBD5E1;position:relative}
.knob{position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(15,23,42,.3)}
.canvas{position:absolute;left:0;top:68px;bottom:0;background-color:#FAFBFC;background-image:radial-gradient(circle,#DDE2EA 1.1px,transparent 1.5px);background-size:22px 22px;overflow:hidden}
.canvas svg.con{position:absolute;left:0;top:0;overflow:visible}
.exn{position:absolute;left:16px;bottom:14px;font-size:12px;font-weight:500;color:var(--sl);background:#fff;border:1px solid var(--bd);border-radius:999px;padding:4px 10px}
.zoomctl{position:absolute;right:16px;bottom:14px;display:flex;background:#fff;border:1px solid var(--bd);border-radius:10px;font-size:13px;color:var(--sl);font-weight:500}
.zoomctl span{padding:5px 10px;border-right:1px solid var(--bd)}
.zoomctl span:last-child{border:0}

/* nodes */
.node{position:absolute;background:#fff;border:1px solid var(--bd);border-radius:14px;display:flex;align-items:center;gap:12px;padding:0 14px;transform-origin:50% 50%}
.ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none}
.nt{font-weight:600;font-size:16px;letter-spacing:-.01em;white-space:nowrap}
.ns{font-size:13px;color:var(--sl);margin-top:2px;white-space:nowrap;display:flex;gap:6px}
.chip{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 7px 2px 5px;border-radius:7px;border:1px solid var(--bd);color:#94A3B8;background:#fff}
.nr{margin-left:auto;position:relative;width:104px;height:28px;flex:none}
.nr>*{position:absolute;right:0;top:50%;transform:translateY(-50%);white-space:nowrap}
.tg{font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;background:#F1F5F9;color:#475569}
.ck{width:24px;height:24px;border-radius:50%;background:var(--grn);display:grid;place-items:center}
.tmr{font-family:var(--mono);font-size:13px;font-weight:500;padding:4px 9px;border-radius:8px;display:flex;align-items:center;gap:6px}
.nbar{position:absolute;left:64px;right:16px;bottom:8px;height:3px;border-radius:2px;background:#EEF2F6;overflow:hidden}
.nbar i{position:absolute;left:0;top:0;bottom:0;background:var(--ind);border-radius:2px}
.ring{position:absolute;inset:-2px;border-radius:15px;border:2px solid var(--ind);pointer-events:none;opacity:0}

/* activity */
#act{position:absolute;background:#fff;overflow:hidden}
#act.card{border:1px solid var(--bd);border-radius:20px;box-shadow:var(--shl)}
#act.pane{border-left:1px solid var(--line)}
.ahd{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);font-size:15px;font-weight:600}
.ahd small{font-family:var(--mono);font-size:12px;font-weight:400;color:var(--sl)}
.empty{position:absolute;left:0;right:0;top:150px;text-align:center;color:#94A3B8;font-size:14px;font-weight:500}
.empty .eic{width:44px;height:44px;border-radius:12px;border:1px dashed #CBD5E1;margin:0 auto 10px;display:grid;place-items:center}
.lcard{position:absolute;left:16px;right:16px;top:66px;height:76px;border:1px solid var(--bd);border-radius:14px;display:flex;align-items:center;gap:12px;padding:0 14px;background:#fff}
.lcard .nm{font-weight:600;font-size:16px}
.lcard .ls{font-size:13px;color:var(--sl);margin-top:2px}
.lcard .st{position:absolute;right:14px;top:26px;width:150px;height:26px}
.stp{position:absolute;right:0;top:0;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.logh{position:absolute;left:18px;top:158px;font-size:12px;font-weight:600;letter-spacing:.06em;color:#94A3B8;text-transform:uppercase}
.rows{position:absolute;left:16px;right:16px;top:180px}
.row{position:absolute;left:0;right:0;height:38px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;color:var(--ink2)}
.row .ri{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none}
.row .rt{margin-left:auto;font-family:var(--mono);font-size:12px;color:#94A3B8}
.slotc{position:absolute;left:16px;right:16px;background:#fff;border:1px solid var(--bd);border-radius:16px;box-shadow:var(--shl);padding:16px 18px}
.ech{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ind)}
.ech small{margin-left:auto;font-family:var(--mono);font-weight:400;color:#94A3B8;font-size:12px}
.eto{font-size:13px;color:var(--sl);margin-top:12px}
.esub{font-size:17px;font-weight:600;margin-top:4px;letter-spacing:-.01em}
.sk{height:8px;border-radius:4px;background:#EEF1F5;margin-top:10px}
.ebtn{display:inline-block;margin-top:14px;background:var(--ind);color:#fff;font-size:13px;font-weight:600;padding:8px 14px;border-radius:9px}
.cal{display:flex;gap:16px;align-items:center}
.cdate{width:64px;height:70px;border-radius:12px;border:1px solid var(--bd);overflow:hidden;text-align:center;flex:none}
.cdate b{display:block;background:var(--ind);color:#fff;font-size:12px;letter-spacing:.08em;padding:4px 0}
.cdate span{display:block;font-size:28px;font-weight:700;line-height:44px}
.ctit{font-size:19px;font-weight:600;letter-spacing:-.01em}
.ctim{font-family:var(--mono);font-size:13px;color:var(--ink2);margin-top:4px}
.cwho{font-size:13px;color:var(--sl);margin-top:3px}

/* phone */
#phone{position:absolute;border-radius:58px;background:#111827;padding:11px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 30px 60px -18px rgba(15,23,42,.38),0 12px 32px -12px rgba(15,23,42,.25),inset 0 0 0 2px #2B3445}
.scr{position:relative;width:100%;height:100%;border-radius:47px;overflow:hidden;background:#fff}
.sbar{position:absolute;left:0;right:0;top:0;height:46px;display:flex;justify-content:space-between;align-items:center;padding:4px 30px 0 34px;font-weight:600;font-size:15px;z-index:3}
.cam{position:absolute;left:50%;top:14px;width:13px;height:13px;margin-left:-6px;border-radius:50%;background:#111827;z-index:4}
.thr{position:absolute;left:0;right:0;top:46px;bottom:0;background:#fff}
.thead{height:76px;border-bottom:1px solid #F1F5F9;display:flex;align-items:center;gap:10px;padding:0 16px}
.thead .nm{font-weight:600;font-size:16px}
.thead .ls{font-size:12px;color:var(--sl);margin-top:1px}
.msgs{position:absolute;top:76px;bottom:70px;left:0;right:0;padding:6px 14px;overflow:hidden}
.mw{overflow:hidden}
.mi{padding-top:10px;display:flex;flex-direction:column}
.bb{max-width:82%;padding:10px 14px;border-radius:20px;font-size:16px;line-height:1.36}
.out{align-self:flex-end;background:var(--ind);color:#fff;border-bottom-right-radius:6px;transform-origin:100% 100%}
.in{align-self:flex-start;background:#F1F5F9;color:var(--ink);border-bottom-left-radius:6px;transform-origin:0 100%}
.meta{align-self:flex-end;font-size:11px;color:#94A3B8;margin-top:4px;font-family:var(--mono)}
.div{align-self:center;font-size:11px;font-weight:600;color:#94A3B8;letter-spacing:.04em;text-transform:uppercase}
.sysp{align-self:center;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--grn);background:var(--grn50);border:1px solid #BBF7D0;border-radius:999px;padding:6px 12px}
.comp{position:absolute;left:0;right:0;bottom:0;height:70px;display:flex;align-items:center;gap:10px;padding:0 14px 8px}
.comp .inp{flex:1;height:40px;border-radius:20px;border:1px solid var(--bd);display:flex;align-items:center;padding:0 14px;color:#94A3B8;font-size:15px}
.comp .snd{width:36px;height:36px;border-radius:50%;background:#E2E8F0;display:grid;place-items:center}
.ban{position:absolute;left:10px;right:10px;top:8px;border-radius:22px;background:rgba(248,250,252,.94);box-shadow:0 10px 30px -8px rgba(15,23,42,.35),0 0 0 1px rgba(15,23,42,.06);padding:12px 14px;display:flex;gap:12px;align-items:center;z-index:5;backdrop-filter:blur(10px)}
.ban .bi{width:38px;height:38px;border-radius:10px;background:var(--grn);display:grid;place-items:center;flex:none}
.ban .bt{font-size:14px;font-weight:600;display:flex;justify-content:space-between}
.ban .bt small{font-weight:400;color:var(--sl);font-size:12px}
.ban .bs{font-size:14px;color:var(--ink2);margin-top:1px}

/* toasts */
.toast{position:absolute;background:#fff;border:1px solid var(--bd);border-radius:16px;box-shadow:var(--shl);display:flex;align-items:center;gap:14px;padding:14px 18px 14px 14px}
.toast .ti{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.toast .tt{font-size:16px;font-weight:600;letter-spacing:-.01em}
.toast .ts{font-size:13px;color:var(--sl);margin-top:2px}
.toast .tm{margin-left:auto;align-self:flex-start;font-family:var(--mono);font-size:11px;color:#94A3B8;padding-top:3px}

/* title */
#title{position:absolute;left:0;top:0;width:100%;height:100%}
.tchip{position:absolute;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:20px;font-weight:500;color:var(--ink2);background:#fff;border:1px solid var(--bd);border-radius:999px;padding:8px 16px;box-shadow:var(--sh)}
.thl{position:absolute;left:0;right:0;text-align:center;font-weight:700;letter-spacing:-.035em;line-height:1.04;color:var(--ink)}
.thl .w{display:inline-block}
.thl em{font-style:normal;color:var(--ind);position:relative;display:inline-block}
.thl em i{position:absolute;left:2%;right:2%;bottom:.02em;height:.08em;border-radius:.04em;background:var(--ind);transform-origin:0 50%;opacity:.9}
.ncard{position:absolute;background:#fff;border:1px solid var(--bd);border-radius:20px;box-shadow:var(--shl);display:flex;align-items:center;gap:16px;padding:18px 22px 18px 18px}
.ncard .ti{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;flex:none}
.ncard .tt{font-size:19px;font-weight:600}
.ncard .ts{font-size:15px;color:var(--sl);margin-top:2px}
.ncard .tm{margin-left:auto;align-self:flex-start;font-family:var(--mono);font-size:13px;color:#94A3B8;padding-top:3px}

/* end */
#endc{position:absolute;background:#fff;border:1px solid var(--bd);border-radius:28px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 30px 80px -24px rgba(15,23,42,.35);text-align:center}
.ebrand{display:flex;align-items:center;justify-content:center;gap:14px;font-weight:700;font-size:28px;letter-spacing:-.02em}
.emark{width:52px;height:52px;border-radius:15px;background:linear-gradient(160deg,#6366F1,#4338CA);display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 6px 16px -6px rgba(79,70,229,.7)}
.ehl{font-weight:700;letter-spacing:-.035em;line-height:1.05;margin-top:30px}
.ehl em{font-style:normal;color:var(--ind)}
.cta{display:inline-flex;align-items:center;gap:12px;background:var(--ind);color:#fff;font-weight:600;border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.1),0 10px 24px -8px rgba(79,70,229,.7),inset 0 1px 0 rgba(255,255,255,.2);position:relative}
.cta::after{content:"";position:absolute;inset:0;border-radius:inherit;background:rgba(255,255,255,.12);opacity:var(--hv,0)}
.url{font-family:var(--mono);color:var(--sl);margin-top:22px}

/* cursor + captions */
#cursor{position:absolute;left:0;top:0;width:32px;height:32px;transform-origin:3px 2px;pointer-events:none;filter:drop-shadow(0 3px 5px rgba(15,23,42,.3))}
.rip{position:absolute;left:0;top:0;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:2px solid var(--ind);background:rgba(79,70,229,.10);pointer-events:none;opacity:0}
#cap{position:absolute;left:0;right:0;display:flex;justify-content:center;pointer-events:none}
#cap{justify-content:flex-start}
#cap .cp{overflow:hidden;box-sizing:border-box;background:rgba(15,23,42,.80);color:#fff;border-radius:999px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;backdrop-filter:blur(12px);box-shadow:0 10px 30px -10px rgba(15,23,42,.5),inset 0 0 0 1px rgba(255,255,255,.08)}
#cap .cw{display:inline-block}

/* player */
#controls{position:fixed;left:0;right:0;bottom:0;height:56px;background:#0F172A;display:flex;align-items:center;gap:14px;padding:0 18px;color:#E2E8F0;font:500 13px Inter,sans-serif}
#controls button{width:36px;height:36px;border-radius:50%;border:0;background:var(--ind);color:#fff;cursor:pointer;font-size:14px}
#bar{flex:1;height:6px;background:#334155;border-radius:3px;cursor:pointer;position:relative}
#bar i{position:absolute;left:0;top:0;bottom:0;background:#818CF8;border-radius:3px}
#tm{font-family:var(--mono);width:110px;text-align:right}
</style>
</head>

<div id="controls"><button id="pp">&#9654;</button><div id="bar"><i></i></div><div id="tm">0.00 / 38.00</div></div>

<script>
(() => {
const Q = new URLSearchParams(location.search);
const WIDE = Q.get('aspect') === '16x9';
const RENDER = Q.has('render');
const W = WIDE ? 1920 : 1080, H = WIDE ? 1080 : 1920, DUR = 38;
const AX = W / 2, AY = H * (WIDE ? 0.47 : 0.46);

/* ---------------- easing ---------------- */
function bez(x1, y1, x2, y2) {
  const A = (a, b) => 1 - 3 * b + 3 * a, B = (a, b) => 3 * b - 6 * a, C = a => 3 * a;
  const calc = (t, a, b) => ((A(a, b) * t + B(a, b)) * t + C(a)) * t;
  const slope = (t, a, b) => 3 * A(a, b) * t * t + 2 * B(a, b) * t + C(a);
  return x => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let t = x;
    for (let i = 0; i < 8; i++) { const s = slope(t, x1, x2); if (Math.abs(s) < 1e-6) break; t -= (calc(t, x1, x2) - x) / s; }
    let lo = 0, hi = 1;
    if (Math.abs(calc(t, x1, x2) - x) > 1e-5) { t = x; for (let i = 0; i < 30; i++) { const v = calc(t, x1, x2); if (v < x) lo = t; else hi = t; t = (lo + hi) / 2; } }
    return calc(t, y1, y2);
  };
}
const EO = bez(0.23, 1, 0.32, 1), EIO = bez(0.77, 0, 0.175, 1);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lin = (t, t0, d) => clamp((t - t0) / d);
const eo = (t, t0, d) => EO(lin(t, t0, d));
const eio = (t, t0, d) => EIO(lin(t, t0, d));
const lerp = (a, b, x) => a + (b - a) * x;
const backOut = x => { const s = 1.25; x = clamp(x) - 1; return x * x * ((s + 1) * x + s) + 1; };
const bump = (t, t0, d) => { const p = (t - t0) / d; return p <= 0 || p >= 1 ? 0 : Math.sin(Math.PI * p); };
// envelope: rises at a over fi, falls at b over fo
const env = (t, a, b, fi = 0.3, fo = 0.35) => eo(t, a, fi) * (1 - eo(t, b, fo));
const col = c => c[0] === '#' ? hex(c) : c.slice(4, -1).split(',').map(Number);
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, x) => { const A = col(a), B = col(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], clamp(x)))).join(',')})`; };

  pillAt([0, 0, 0, 0], [9.2, 11.6, 15.55, 22.45], 'stS');
  pillAt([0, 0], [26.85, 29.9], 'stD');
  SAMLOG.forEach((r, k) => { const e = eo(t, r[0], 0.4); S($('rs' + k), e * (1 - sw), `translateY(${(1 - e) * 10}px) translateX(${-30 * sw}px)`); });
  DANALOG.forEach((r, k) => { const e = eo(t, r[0], 0.4); S($('rd' + k), e, `translateY(${(1 - e) * 10}px) translateX(${30 * (1 - sw)}px)`); });
  // email card
  const emIn = eo(t, 17.15, 0.55), emOut = eo(t, 20.6, 0.4);
  S($('email'), emIn * (1 - emOut), `translateX(${(1 - emIn) * 60}px) translateY(${-14 * emOut}px) scale(${0.97 + 0.03 * emIn})`);
  // calendar card drops
  const cIn = lin(t, 22.05, 0.55), cOut = eo(t, 26.6, 0.35);
  S($('calc'), EO(clamp(cIn * 1.6)) * (1 - cOut), `translateY(${(1 - backOut(cIn)) * -46 + 10 * cOut}px) scale(${0.97 + 0.03 * EO(cIn)})`);

  /* phone */
  const thX = eio(t, 26.85, 0.55);
  $('thS').style.transform = `translateX(${-30 * thX}%)`;
  $('thS').style.opacity = 1 - 0.6 * thX;
  $('thD').style.transform = `translateX(${100 * (1 - thX)}%)`;
  $('thD').style.boxShadow = thX > 0 && thX < 1 ? '-12px 0 30px rgba(15,23,42,.12)' : 'none';
  const MSG = { sm0: 8.6, sm1: 11.35, sm2: 21.0, sm3: 21.15, sm4: 22.4, dm0: 0, dm1: 0, dm2: 29.25, dm3: 29.75 };
  Object.entries(MSG).forEach(([id, t0]) => {
    const el = $(id), e = t0 === 0 ? 1 : eo(t, t0, 0.5), h = MH[id] || 0;
    el.style.height = (h * EO(lin(t, t0, 0.35)) + (t0 === 0 ? h : 0)) * (t0 === 0 ? 0 : 1) + (t0 === 0 ? h : 0) + 'px';
    if (t0 !== 0) el.style.height = h * EO(lin(t, t0, 0.35)) + 'px';
    const inner = el.firstElementChild.firstElementChild;
    S(el.firstElementChild, e, `translateY(${(1 - e) * 10}px)`);
    if (inner.classList.contains('bb')) inner.style.transform = `scale(${0.94 + 0.06 * e})`;
  });
  S($('sm1m'), eo(t, 11.85, 0.3));
  S($('dm3m'), eo(t, 30.2, 0.3));
  // notification banner
  const bIn = eo(t, 20.65, 0.5), bOut = eio(t, 21.2, 0.35);
  S($('ban'), bIn * (1 - bOut), `translateY(${(1 - bIn) * -90 - bOut * 70}px) scale(${0.97 + 0.03 * bIn})`);

  /* toasts */
  TOASTS.forEach((o, k) => {
    const a = eo(t, o[0], 0.5), b = eo(t, o[1], 0.35);
    S($('to' + k), a * (1 - b), `translateY(${(1 - a) * -24 - b * 12}px) scale(${0.97 + 0.03 * a})`);
  });

  /* end card */
  const ec = eo(t, 32.15, 0.7);
  S(E, ec, `translateY(${(1 - ec) * 24}px) scale(${0.96 + 0.04 * ec})`);
  E.style.display = t < 32 ? 'none' : 'block';
  ['e0', 'e1', 'e2', 'e3'].forEach((id, k) => { const e = eo(t, 32.3 + k * 0.08, 0.6); S($(id), e, `translateY(${(1 - e) * 14}px)`); });
  const cb = bump(t, 35.23, 0.2);
  $('cta').style.transform = `scale(${1 - 0.03 * cb})`;

  /* cursor */
  const cpz = curPos(t, c);
  const cVis = eo(t, 2.95, 0.4) * (1 - eo(t, 31.35, 0.25) * (1 - eo(t, 31.9, 0.4)));
  const sc = (t > 31.6 ? 1.15 : Math.sqrt(c.s)) * (WIDE ? 1 : 1.25);
  let press = 1;
  let rp = null;
  CLICKS.forEach(([tc, id]) => {
    press -= 0.12 * bump(t, tc - 0.05, 0.2);
    const p = lin(t, tc, 0.5);
    if (p > 0 && p < 1) rp = [p, tc];
  });
  cursor.style.opacity = cVis;
  cursor.style.transform = `translate(${cpz[0] - 3}px,${cpz[1] - 2}px) scale(${sc * press})`;
  if (rp) {
    const [p] = rp;
    rip.style.opacity = 0.9 * (1 - p);
    rip.style.transform = `translate(${cpz[0]}px,${cpz[1]}px) scale(${(0.35 + 1.0 * EO(p)) * (WIDE ? 1 : 1.2)})`;
  } else rip.style.opacity = 0;

  /* captions */
  let ci = -1;
  for (let k = 0; k < CHUNKS.length; k++) if (t >= CHUNKS[k].t0 - 0.06 && t < CHUNKS[k].t1) ci = k;
  if (ci !== capIdx) {
    capIdx = ci;
    cp.innerHTML = ci < 0 ? '' : CHUNKS[ci].words.map(x => `<span class="cw">${x.w}</span>`).join(' ');
    if (ci >= 0) {
      cp.style.width = 'auto';
      const full = cp.offsetWidth, padL = parseFloat(getComputedStyle(cp).paddingLeft);
      CHUNKS[ci].edges = [...cp.children].map(sp => sp.offsetLeft + sp.offsetWidth - padL);
      CHUNKS[ci].pad = padL; CHUNKS[ci].full = full;
      cp.style.marginLeft = ((W - full) / 2) + 'px';
    }
  }
  if (ci < 0) { cp.style.opacity = 0; }
  else {
    const C = CHUNKS[ci];
    const fin = eo(t, C.t0 - 0.06, 0.18), fout = 1 - eo(t, C.t1 - 0.12, 0.12);
    const nx = CHUNKS[ci + 1];
    const cont = nx && nx.line === C.line;
    cp.style.opacity = cont ? 1 : fin * fout;
    cp.style.transform = `translateY(${cont ? 0 : (1 - fin) * 8}px)`;
    const spans = cp.children;
    let curW = -1;
    C.words.forEach((x, k) => { if (t >= x.s - 0.03) curW = k; });
    C.words.forEach((x, k) => {
      const e = eo(t, x.s - 0.03, 0.16);
      spans[k].style.opacity = e;
      spans[k].style.transform = `translateY(${(1 - e) * 6}px)`;
      spans[k].style.color = k === curW ? '#C7D2FE' : '#FFFFFF';
    });
    let wd = 0;
    C.words.forEach((x, k) => { const e = eo(t, x.s - 0.03, 0.22); if (e > 0) wd = lerp(k ? C.edges[k - 1] : 0, C.edges[k], e); });
    cp.style.width = (wd + 2 * C.pad + 2) + 'px';
  }
}

/* ---------------- boot ---------------- */
const fit = () => {
  if (RENDER) { stage.style.transform = 'none'; return; }
  const k = Math.min((innerWidth - 40) / W, (innerHeight - 56 - 40) / H);
  stage.style.transform = `scale(${k})`;
  frame.style.width = W * k + 'px'; frame.style.height = H * k + 'px';
};
async function boot() {
  if (RENDER) document.body.classList.add('render');
  const fams = ['400 16px Inter', '500 16px Inter', '600 16px Inter', '700 16px Inter', '400 16px "JetBrains Mono"', '500 16px "JetBrains Mono"'];
  try { await Promise.all(fams.map(f => document.fonts.load(f))); await document.fonts.ready; } catch (e) {}
  fit(); addEventListener('resize', fit);
  measure(); CK = camKeys(); UK = curKeys();
  seek(0);
  if (RENDER) { window.__duration = DUR; window.__seek = t => seek(t); return; }
  window.__seek = seek;
  let t = 0, playing = false, last = 0;
  const pp = $('pp'), bar = $('bar'), tm = $('tm');
  const show = () => { seek(t); bar.firstElementChild.style.width = (t / DUR * 100) + '%'; tm.textContent = `${t.toFixed(2)} / ${DUR.toFixed(2)}`; };
  const loop = now => { if (!playing) return; t += (now - last) / 1000; last = now; if (t >= DUR) { t = DUR; playing = false; pp.innerHTML = '&#9654;'; } show(); if (playing) requestAnimationFrame(loop); };
  const toggle = () => { playing = !playing; pp.innerHTML = playing ? '&#10073;&#10073;' : '&#9654;'; if (playing) { if (t >= DUR) t = 0; last = performance.now(); requestAnimationFrame(loop); } };
  pp.onclick = toggle;
  addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); toggle(); } });
  bar.onclick = e => { const r = bar.getBoundingClientRect(); t = clamp((e.clientX - r.left) / r.width) * DUR; show(); };
  const qt = parseFloat(Q.get('t')); if (!isNaN(qt)) t = qt;
  show();
}
boot();
})();
