<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Track Booked Estimates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Neo-brutalist infographic explainer: "Track booked estimates by source". One clock: seek(t) sets everything. */
:root{
  --cream:#FFF4D6; --ink:#111111; --tomato:#FF5A36; --cobalt:#2F5BFF; --lime:#B6F03C; --bubble:#FF8FD0; --sun:#FFD23F;
  --paper:#FFFBEE;
  --display:"Archivo Black",Impact,sans-serif; --label:"Space Grotesk",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#1b1b1b;color:var(--ink);font-family:var(--label);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#frame{position:relative;overflow:hidden;box-shadow:8px 8px 0 #000}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:var(--cream)}
#bg{position:absolute;inset:0;background-color:var(--cream);
  background-image:radial-gradient(circle,rgba(17,17,17,.16) 1.6px,transparent 2px);background-size:40px 40px;background-position:20px 20px}
.abs{position:absolute;left:0;top:0;will-change:transform,opacity}
.scene{position:absolute;inset:0;display:none}
.blk{position:absolute;border:4px solid var(--ink);box-shadow:8px 8px 0 var(--ink);white-space:nowrap}
.disp{font-family:var(--display);font-weight:400;line-height:.92;letter-spacing:-.01em;text-transform:uppercase}
.lab{font-family:var(--label);font-weight:700;letter-spacing:-.01em}
.mono{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:0}
.chip{position:absolute;white-space:nowrap;border:3px solid var(--ink)}
.tile{display:inline-block;background:var(--ink);color:#fff;font-family:var(--label);font-weight:700;white-space:nowrap}
.tile.on{background:var(--lime);color:var(--ink)}
#caps{position:absolute;left:0;right:0;display:flex;justify-content:center;align-items:center;pointer-events:none}
.cap{position:absolute;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:nowrap}
.wipe{position:absolute;left:0;top:0;display:none;overflow:hidden}
.wipe .num{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--display);color:var(--ink);line-height:1}
svg{overflow:visible}
/* player */
#controls{display:flex;align-items:center;gap:12px;width:min(92vw,900px);color:#eee;font-family:var(--mono);font-size:14px}
#controls button{font-family:var(--label);font-weight:700;background:var(--lime);border:3px solid #000;box-shadow:4px 4px 0 #000;padding:6px 14px;cursor:pointer;font-size:15px;min-width:84px}
#bar{flex:1;height:16px;background:#333;border:3px solid #000;cursor:pointer;position:relative}
#fill{position:absolute;left:0;top:0;bottom:0;background:var(--sun)}
body.render{background:var(--cream);display:block}
body.render #controls{display:none}
body.render #frame{box-shadow:none}
</style>
</head>
<body>
<div id="frame"><div id="stage">
  <div id="bg"></div>
  <div id="world" class="abs"></div>
  <div id="chrome" class="abs"></div>
  <div id="wipes" class="abs"></div>
  <div id="caps"></div>
</div></div>
<div id="controls"><button id="play">Play</button><div id="bar"><div id="fill"></div></div><span id="time">0.00 / 38.00</span></div>

<script type="application/json" id="vo">
[
 {"t0": 0.3, "t1": 2.02, "text": "Not sure your marketing is working?"},
 {"t0": 2.8, "t1": 6.48, "text": "Clicks and lead counts don't pay the bills. Booked estimates do."},
 {"t0": 8.8, "t1": 13.41, "text": "Tag every lead with its source: Google, Facebook, referrals, or lead sites."},
 {"t0": 14.8, "t1": 18.53, "text": "Then follow each one to a booked estimate, and to a closed job."},
 {"t0": 20.8, "t1": 24.26, "text": "Now you can see the cost per booked estimate, for every source."},
 {"t0": 26.8, "t1": 29.19, "text": "Spend more where it books. Cut what doesn't."},
 {"t0": 32.3, "t1": 36.18, "text": "Want clear numbers? Get a tracking review from Elevate Home Ads."}
]
</script>
<script>
(() => {
const Q = new URLSearchParams(location.search);
const RENDER = Q.has('render');
const WIDE = Q.get('aspect') === '16x9';
const W = WIDE ? 1920 : 1080, H = WIDE ? 1080 : 1920;
const L = (p, w) => WIDE ? w : p;
const DUR = 38;
const C = {cream:'#FFF4D6', ink:'#111111', tomato:'#FF5A36', cobalt:'#2F5BFF', lime:'#B6F03C', bubble:'#FF8FD0', sun:'#FFD23F', paper:'#FFFBEE'};

/* ---------- easing ---------- */
function bez(x1, y1, x2, y2) {
  return t => {
    if (t <= 0) return 0; if (t >= 1) return 1;
    let lo = 0, hi = 1, u = t;
    for (let i = 0; i < 28; i++) { u = (lo + hi) / 2; const x = 3*(1-u)*(1-u)*u*x1 + 3*(1-u)*u*u*x2 + u*u*u; if (x < t) lo = u; else hi = u; }
    return 3*(1-u)*(1-u)*u*y1 + 3*(1-u)*u*u*y2 + u*u*u;
  };
}
const eOut = bez(.23, 1, .32, 1), eIO = bez(.77, 0, .175, 1);
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const pr = (t, a, d) => cl((t - a) / d);
const back = (p, s = 1.6) => { p = cl(p); if (p >= 1) return 1; const q = p - 1; return 1 + q*q*((s+1)*q + s); };
const lerp = (a, b, p) => a + (b - a) * p;

/* ---------- voice-over word times ---------- */
const VO = JSON.parse(document.getElementById('vo').textContent);
VO.forEach(l => {
  const words = l.text.split(' '); const tot = l.text.length; let c = 0;
  l.words = words.map(w => { const s = l.t0 + (l.t1 - l.t0) * c / tot; c += w.length + 1; return {w, s}; });
});
const norm = w => w.toLowerCase().replace(/[^a-z']/g, '');
const WT = (li, key, n = 0) => { const m = VO[li].words.filter(x => norm(x.w).startsWith(key)); return (m[n] || m[0]).s; };

/* ---------- DOM helpers ---------- */
const $ = id => document.getElementById(id);
const stage = $('stage'), world = $('world');
stage.style.width = W + 'px'; stage.style.height = H + 'px';
function mk(parent, cls, css = {}, html = '') {
  const e = document.createElement('div'); if (cls) e.className = cls;
  for (const k in css) e.style[k] = typeof css[k] === 'number' && !['opacity','zIndex','fontWeight','lineHeight'].includes(k) ? css[k] + 'px' : css[k];
  if (html) e.innerHTML = html; parent.appendChild(e); return e;
}
function setT(el, tf, op) { el.style.transform = (el._pre || '') + ' ' + tf; if (op !== undefined) el.style.opacity = op; }
const ICON = {
  circle: f => `<circle cx="32" cy="32" r="24" fill="${f}" stroke="#111" stroke-width="5"/>`,
  square: f => `<rect x="9" y="9" width="46" height="46" fill="${f}" stroke="#111" stroke-width="5"/>`,
  triangle: f => `<polygon points="32,7 58,55 6,55" fill="${f}" stroke="#111" stroke-width="5" stroke-linejoin="miter"/>`,
  diamond: f => `<polygon points="32,5 59,32 32,59 5,32" fill="${f}" stroke="#111" stroke-width="5"/>`,
};
const icon = (k, s, f) => `<svg width="${s}" height="${s}" viewBox="0 0 64 64" style="display:block;flex:none">${ICON[k](f)}</svg>`;
const SRC = [
  {name:'Google', tag:'GOOGLE', col:C.cobalt, txt:C.cream, ic:'circle', leads:30, booked:12, closed:5},
  {name:'Facebook', tag:'FACEBOOK', col:C.bubble, txt:C.ink, ic:'square', leads:24, booked:5, closed:2},
  {name:'Referrals', tag:'REFERRAL', col:C.lime, txt:C.ink, ic:'triangle', leads:12, booked:9, closed:7},
  {name:'Lead sites', tag:'LEAD SITE', col:C.tomato, txt:C.ink, ic:'diamond', leads:36, booked:4, closed:1},
];

/* ---------- motion primitives ---------- */
// slam: block drops in from (dx,dy) with a short overshoot, scale 0.96 -> 1
function slam(el, t, t0, o = {}) {
  const dur = o.dur || .42, dx = o.dx || 0, dy = o.dy === undefined ? -70 : o.dy, rot = o.rot || 0;
  const p = (t - t0) / dur;
  if (p <= 0) { el.style.opacity = 0; el.style.visibility = 'hidden'; return 0; }
  el.style.visibility = 'visible';
  const e = back(p, o.s || 1.7);
  setT(el, `translate(${dx*(1-e)}px,${dy*(1-e)}px) rotate(${rot}deg) scale(${.96 + .04*eOut(cl(p))})`, cl((t - t0) / .09));
  return cl(p);
}
// stamp: drops from 1.45x, thunks with a damped squash
function stamp(el, t, t0, rot = 0) {
  const p = t - t0;
  if (p <= 0) { el.style.opacity = 0; el.style.visibility = 'hidden'; return; }
  el.style.visibility = 'visible';
  let sx, sy;
  if (p < .13) { const q = p / .13; sx = sy = 1.45 - .45 * q * q * 0 - .45 * q; }
  else { const u = p - .13; const sq = .16 * Math.exp(-9 * u) * Math.cos(u * 28); sx = 1 + sq; sy = 1 - sq; }
  setT(el, `rotate(${rot}deg) scale(${sx},${sy})`, cl(p / .07));
}
function count(t, t0, dur, v) { return Math.round(v * eOut(pr(t, t0, dur))); }
const fmt = n => n.toLocaleString('en-US');

/* ======================================================================
   CHROME (beats 1-5)
   ====================================================================== */
const chrome = $('chrome');
const BEATS = [[2.5, 8.5], [8.5, 14.5], [14.5, 20.5], [20.5, 26.5], [26.5, 32]];
const CHIPS = ['WHAT COUNTS', 'TAG THE SOURCE', 'FOLLOW EACH LEAD', 'COST PER BOOKED', 'MOVE THE BUDGET'];
const chBrand = mk(chrome, 'chip lab', {left: L(64, 120), top: L(64, 46), background: C.ink, color: C.cream, fontSize: L(24, 22), padding: '10px 16px', borderColor: C.ink}, 'ELEVATE HOME ADS');
const chBeat = mk(chrome, 'chip lab', {left: L(64, 420), top: L(126, 46), background: C.sun, fontSize: L(30, 22), padding: L('8px 16px', '10px 16px'), boxShadow: '5px 5px 0 #111'});
const chCount = mk(chrome, 'chip mono', {right: L(64, 120), top: L(64, 46), left: 'auto', background: C.paper, fontSize: L(24, 22), padding: '10px 14px'});
const chSq = [];
for (let i = 0; i < 5; i++) chSq.push(mk(chrome, '', {position: 'absolute', width: 26, height: 26, border: '3px solid #111', left: W - L(64, 120) - (5 - i) * 34 + 8, top: L(124, 106)}));
const exTag = mk(chrome, 'chip mono', {background: C.paper, fontSize: L(20, 18), padding: '6px 10px', left: L(64, 1560), top: L(1548, 864), transform: 'rotate(-2deg)'}, 'EXAMPLE NUMBERS');

/* ======================================================================
   TITLE 0-2.5
   ====================================================================== */
const sTitle = mk(world, 'scene');
const tt = {
  tag: mk(sTitle, 'blk mono', {left: L(80, 120), top: L(330, 150), background: C.sun, fontSize: L(28, 26), padding: '8px 14px', boxShadow: '5px 5px 0 #111', borderWidth: 3}, 'MARKETING CHECK-UP / 01'),
  l1: mk(sTitle, 'blk disp', {left: L(80, 120), top: L(430, 230), background: C.ink, color: C.cream, fontSize: L(150, 132), padding: '18px 26px 10px'}, 'NOT SURE'),
  l2: mk(sTitle, 'blk disp', {left: L(80, 120), top: L(632, 400), background: C.paper, fontSize: L(150, 132), padding: '18px 26px 10px'}, 'YOUR'),
  l3: mk(sTitle, 'blk disp', {left: L(80, 120), top: L(834, 570), background: C.tomato, fontSize: L(138, 160), padding: '18px 26px 10px'}, 'MARKETING'),
  l4: mk(sTitle, 'blk disp', {left: L(80, 120), top: L(1022, 770), background: C.sun, fontSize: L(104, 92), padding: '16px 24px 8px'}, 'IS WORKING'),
  q: mk(sTitle, 'blk disp', {left: L(650, 1400), top: L(1140, 260), width: L(330, 400), height: L(330, 400), borderRadius: '50%', background: C.cobalt, color: C.cream, fontSize: L(260, 320), display: 'flex', alignItems: 'center', justifyContent: 'center', borderWidth: 6, boxShadow: '12px 12px 0 #111', paddingTop: L(20, 26)}, '?'),
  bar: mk(sTitle, '', {position: 'absolute', left: L(80, 120), top: L(1530, 896), width: L(920, 1680), height: L(22, 16), background: C.ink, display: L('block', 'none')}),
};
const tTimes = {tag: .1, l1: WT(0, 'not'), l2: WT(0, 'your'), l3: WT(0, 'marketing'), l4: WT(0, 'is'), q: WT(0, 'is') - .05};
function seekTitle(t) {
  slam(tt.tag, t, tTimes.tag, {dy: -30});
  slam(tt.l1, t, tTimes.l1, {dx: -90, dy: 0});
  slam(tt.l2, t, tTimes.l2, {dx: -90, dy: 0});
  slam(tt.l3, t, tTimes.l3, {dx: -90, dy: 0});
  slam(tt.l4, t, tTimes.l4, {dx: -90, dy: 0});
  stamp(tt.q, t, tTimes.q, -8);
  tt.bar.style.transformOrigin = '0 50%';
  tt.bar.style.transform = `scaleX(${eOut(pr(t, .2, 1.6))})`;
}

/* ======================================================================
   BEAT 1  2.5-8.5  clicks / leads crossed out -> BOOKED ESTIMATES
   ====================================================================== */
const s1 = mk(world, 'scene');
function statBox(parent, x, y, w, h, label, num, numLabel) {
  const b = mk(parent, 'blk', {left: x, top: y, width: w, height: h, background: C.paper});
  mk(b, 'disp', {position: 'absolute', left: 32, top: L(40, 38), fontSize: L(118, 104)}, label);
  const n = mk(b, 'mono', {position: 'absolute', right: 30, bottom: L(30, 28), fontSize: L(54, 48), textAlign: 'right'}, '0');
  mk(b, 'mono', {position: 'absolute', left: 34, bottom: L(30, 28), fontSize: L(22, 20), background: C.ink, color: C.cream, padding: '3px 8px'}, numLabel);
  const x1 = mk(parent, '', {position: 'absolute', left: x - 30, top: y + h / 2 - 18, width: w + 60, height: 36, background: C.ink, transformOrigin: '0 50%'});
  return {b, n, x: x1, v: num};
}
const b1 = WIDE ? {cx: 120, cy: 220, cw: 760, ch: 220, ly: 480, bx: 990, by: 220, bw: 810, bh: 480} : {cx: 80, cy: 270, cw: 920, ch: 230, ly: 545, bx: 80, by: 880, bw: 920, bh: 520};
const k1 = {
  clicks: statBox(s1, b1.cx, b1.cy, b1.cw, b1.ch, 'CLICKS', 12480, 'THIS MONTH'),
  leads: statBox(s1, b1.cx, b1.ly, b1.cw, b1.ch, 'LEADS', 326, 'THIS MONTH'),
};
mk(s1, '', {position: 'absolute', left: b1.bx, top: b1.by, width: b1.bw, height: b1.bh, border: '4px dashed rgba(17,17,17,.3)'});
k1.booked = mk(s1, 'blk', {left: b1.bx, top: b1.by, width: b1.bw, height: b1.bh, background: C.lime, boxShadow: '14px 14px 0 #111'});
mk(k1.booked, 'disp', {position: 'absolute', left: 40, top: L(60, 56), fontSize: L(130, 112), lineHeight: .95}, 'BOOKED<br>ESTIMATES');
k1.bookedN = mk(k1.booked, 'mono', {position: 'absolute', left: 44, bottom: L(48, 44), fontSize: L(34, 30), background: C.ink, color: C.lime, padding: '6px 12px'}, '');
k1.coin = mk(s1, 'blk disp', {left: b1.bx + b1.bw - L(190, 180), top: b1.by + b1.bh - L(190, 180), width: L(260, 260), height: L(260, 260), borderRadius: '50%', background: C.sun, fontSize: L(170, 170), display: 'flex', alignItems: 'center', justifyContent: 'center', borderWidth: 6, paddingTop: 14}, '$');
const t1 = {cl: WT(1, 'clicks'), le: WT(1, 'lead'), x1: WT(1, "don't"), x2: WT(1, 'bills') - .05, bk: WT(1, 'booked'), coin: WT(1, 'do', 1) + .02};
function seek1(t) {
  slam(k1.clicks.b, t, Math.min(t1.cl, 2.75), {dx: -80, dy: 0});
  slam(k1.leads.b, t, t1.le, {dx: -80, dy: 0});
  k1.clicks.n.textContent = fmt(count(t, t1.cl, 1.4, 12480));
  k1.leads.n.textContent = fmt(count(t, t1.le, 1.2, 326));
  [[k1.clicks, t1.x1], [k1.leads, t1.x2]].forEach(([k, tx]) => {
    const p = eOut(pr(t, tx, .28));
    k.x.style.visibility = p > 0 ? 'visible' : 'hidden';
    k.x.style.transform = `rotate(-3deg) scaleX(${p})`;
    const d = eOut(pr(t, tx + .1, .4));
    k.b.style.background = d > .5 ? '#EFE4C4' : C.paper;
    k.b.style.color = d > .5 ? 'rgba(17,17,17,.55)' : C.ink;
  });
  slam(k1.booked, t, t1.bk, {dy: L(140, 0), dx: L(0, 140), dur: .5});
  k1.bookedN.textContent = 'BOOKED: ' + count(t, t1.bk + .2, 1.2, 30) + ' / MO';
  stamp(k1.coin, t, t1.coin, 12);
}

/* ======================================================================
   BEAT 2  8.5-14.5  four sources, lead dots get tagged
   ====================================================================== */
const s2 = mk(world, 'scene');
const g2 = WIDE ? {sx: k => 120, sy: k => 180 + k * 168, sw: 520, sh: 146, px: 770, py: 180, pw: 1030, ph: 654}
                : {sx: k => 80 + (k % 2) * 480, sy: k => 270 + Math.floor(k / 2) * 230, sw: 440, sh: 196, px: 80, py: 780, pw: 920, ph: 720};
const src2 = SRC.map((s, k) => {
  mk(s2, '', {position: 'absolute', left: g2.sx(k), top: g2.sy(k), width: g2.sw, height: g2.sh, border: '4px dashed rgba(17,17,17,.3)'});
  const b = mk(s2, 'blk', {left: g2.sx(k), top: g2.sy(k), width: g2.sw, height: g2.sh, background: s.col, color: s.txt, display: 'flex', alignItems: 'center', gap: L(22, 24), padding: L('0 28px', '0 30px')});
  b.innerHTML = icon(s.ic, L(76, 72), C.cream) + `<span class="lab" style="font-size:${L(46, 50)}px">${s.name}</span>`;
  return b;
});
const panel2 = mk(s2, 'blk', {left: g2.px, top: g2.py, width: g2.pw, height: g2.ph, background: C.paper});
const p2head = mk(panel2, 'lab', {position: 'absolute', left: -4, top: -4, background: C.ink, color: C.cream, fontSize: L(30, 28), padding: '10px 18px'}, 'NEW LEADS');
const p2count = mk(panel2, 'mono', {position: 'absolute', right: 20, top: 16, fontSize: L(30, 28)}, '');
const cols2 = 4, rows2 = 3, slotW = (g2.pw - 40) / cols2, slotH = (g2.ph - 100) / rows2;
const slotXY = s => [g2.px + 20 + (s % cols2 + .5) * slotW, g2.py + 84 + (Math.floor(s / cols2) + .5) * slotH];
for (let s = 0; s < 12; s++) { const [x, y] = slotXY(s); mk(s2, '', {position: 'absolute', left: x - 42, top: y - 56, width: 84, height: 84, borderRadius: '50%', border: '3px dashed rgba(17,17,17,.28)'}); }
const PERM = [5, 0, 10, 3, 8, 1, 11, 6, 2, 9, 4, 7];
const person = `<svg width="84" height="84" viewBox="0 0 84 84" style="position:absolute;left:-4px;top:-4px"><circle cx="42" cy="33" r="12" fill="#111"/><path d="M20 66 C22 50 62 50 64 66 Z" fill="#111"/></svg>`;
const dots2 = [];
SRC.forEach((s, k) => { for (let i = 0; i < 3; i++) {
  const d = mk(s2, '', {position: 'absolute', left: 0, top: 0, width: 84, height: 84, borderRadius: '50%', background: '#fff', border: '4px solid #111', boxShadow: '5px 5px 0 #111', zIndex: 5}, person);
  const tag = mk(s2, 'mono', {position: 'absolute', left: 0, top: 0, background: s.col, color: s.txt, border: '3px solid #111', fontSize: L(19, 18), padding: '3px 8px', whiteSpace: 'nowrap', zIndex: 6, boxShadow: '3px 3px 0 #111'}, s.tag);
  tag._pre = 'translate(-50%,0)';
  dots2.push({d, tag, k, i, slot: PERM[k * 3 + i]});
}});
const t2 = {panel: WT(2, 'tag'), src: [WT(2, 'google'), WT(2, 'facebook'), WT(2, 'referrals'), WT(2, 'lead', 1)]};
function seek2(t) {
  src2.forEach((b, k) => slam(b, t, t2.src[k], {dy: -60}));
  slam(panel2, t, Math.max(8.62, t2.panel - .1), {dy: L(80, 0), dx: L(0, 80)});
  let tagged = 0;
  dots2.forEach(o => {
    const st = t2.src[o.k] + .22 + o.i * .2, mv = .58;
    const [ex, ey] = slotXY(o.slot);
    const sx = g2.sx(o.k) + g2.sw * L(.5, .82), sy = g2.sy(o.k) + g2.sh * L(.72, .5);
    if (t < st) { o.d.style.visibility = 'hidden'; o.tag.style.visibility = 'hidden'; return; }
    o.d.style.visibility = 'visible';
    const pop = eOut(pr(t, st, .18));
    const m = eIO(pr(t, st + .08, mv));
    const x = lerp(sx, ex, m), y = lerp(sy, ey - 14, m) - Math.sin(Math.PI * m) * 90;
    o.d.style.left = (x - 42) + 'px'; o.d.style.top = (y - 42) + 'px';
    o.d.style.transform = `scale(${.9 + .1 * pop})`; o.d.style.opacity = pop;
    const tt0 = st + .08 + mv - .02;
    o.tag.style.left = ex + 'px'; o.tag.style.top = (ey + 22) + 'px';
    stamp(o.tag, t, tt0, (o.slot % 3 - 1) * 5);
    if (t >= tt0) tagged++;
  });
  p2count.textContent = 'TAGGED ' + String(tagged).padStart(2, '0') + '/12';
}

/* ======================================================================
   BEAT 3  14.5-20.5  Sankey: source -> booked estimate -> closed job
   ====================================================================== */
const s3 = mk(world, 'scene');
const G3 = WIDE ? {k: 3.6, u0: 520, u1: 1080, u2: 1640, nw: 60, vc: 540, srcV: [300, 460, 620, 780], boxU: 120, boxT: 140}

const eCheck = mk(sEnd, 'blk disp', {left: L(800, 1420), top: L(1260, 370), width: L(220, 220), height: L(220, 220), borderRadius: '50%', background: C.bubble, fontSize: L(44, 44), display: 'flex', alignItems: 'center', justifyContent: 'center', textAlign: 'center', borderWidth: 6, lineHeight: 1}, 'BOOKED<br>BY<br>SOURCE');
const tE = {tag: WT(6, 'want'), cta: WT(6, 'get') - .05, brand: WT(6, 'elevate') - .1, url: WT(6, 'ads') + .05, icons: 32.5, check: WT(6, 'ads') + .5};
function seekEnd(t) {
  slam(eTag, t, tE.tag, {dy: -40});
  slam(eCta, t, tE.cta, {dx: -100, dy: 0, dur: .5});
  slam(eBrand, t, tE.brand, {dx: -100, dy: 0, dur: .5});
  slam(eUrl, t, tE.url, {dy: 50});
  eIcons.forEach((b, k) => slam(b, t, tE.icons + k * .07, {dy: -80, rot: [-4, 3, -2, 5][k]}));
  stamp(eCheck, t, tE.check, 10);
}

/* ======================================================================
   WIPES (hard-edged colour block pushes)
   ====================================================================== */
const wipesEl = $('wipes');
const WIPES = [[2.5, C.tomato, '01', 'h'], [8.5, C.cobalt, '02', 'v'], [14.5, C.sun, '03', 'h'], [20.5, C.bubble, '04', 'v'], [32, C.lime, '&rarr;', 'h']];
const wipeEls = WIPES.map(([b, col, num, dir]) => {
  const ink = mk(wipesEl, 'wipe', {width: W, height: H, background: C.ink});
  const c = mk(wipesEl, 'wipe', {width: W, height: H, background: col});
  c.style[dir === 'h' ? 'borderRight' : 'borderTop'] = '0';
  mk(c, 'num', {fontSize: L(520, 520), color: col === C.cobalt ? C.cream : C.ink}, num);
  return {b, ink, c, dir};
});
function seekWipes(t) {
  wipeEls.forEach(w => {
    [[w.ink, .07], [w.c, 0]].forEach(([el, lag]) => {
      const tin = w.b - .42 - lag, tout = w.b + .06 + lag;
      if (t < tin || t > tout + .36) { el.style.display = 'none'; return; }
      el.style.display = 'block';
      let off;
      if (t < w.b) off = -(1 - eIO(pr(t, tin, .36)));   // -1 -> 0 (covering)
      else off = eIO(pr(t, tout, .36));                 // 0 -> 1 (revealing)
      el.style.transform = w.dir === 'h' ? `translateX(${off * W}px)` : `translateY(${-off * H}px)`;
    });
  });
}

/* ======================================================================
   CAPTIONS
   ====================================================================== */
const caps = $('caps');
const CAPY = L(1700, 990);
caps.style.top = (CAPY - 50) + 'px'; caps.style.height = '100px';
const chunks = [];
VO.forEach((l, li) => {
  let cur = [];
  l.words.forEach((w, wi) => { cur.push(w); if (cur.length >= 4 || /[.?:]$/.test(w.w) || (/,$/.test(w.w) && cur.length >= 2) || wi === l.words.length - 1) { chunks.push({li, words: cur}); cur = []; } });
});
chunks.forEach((c, i) => {
  const nx = chunks[i + 1];
  const l = VO[c.li];
  c.start = c.words[0].s;
  c.end = nx && nx.li === c.li ? nx.words[0].s : Math.min(l.t1 + .55, nx ? nx.words[0].s - .05 : 99);
  c.el = mk(caps, 'cap', {});
  c.tiles = c.words.map(w => { const e = document.createElement('span'); e.className = 'tile'; e.textContent = w.w; e.style.fontSize = L(50, 42) + 'px'; e.style.padding = L('8px 16px 10px', '6px 14px 8px'); c.el.appendChild(e); return e; });
});
function seekCaps(t) {
  chunks.forEach(c => {
    if (t < c.start || t >= c.end) { c.el.style.display = 'none'; return; }
    c.el.style.display = 'flex';
    const l = VO[c.li];
    c.words.forEach((w, i) => {
      const e = c.tiles[i]; const p = eOut(pr(t, w.s, .14));
      e.style.opacity = p; e.style.transform = `translateY(${12 * (1 - p)}px)`;
      const nextS = i + 1 < c.words.length ? c.words[i + 1].s : Math.min(l.t1 + .1, c.end);
      e.classList.toggle('on', t >= w.s && t < nextS);
    });
    const nx = chunks[chunks.indexOf(c) + 1];
    const fade = (!nx || nx.li !== c.li) && c.end - t < .15 ? (c.end - t) / .15 : 1;
    c.el.style.opacity = fade;
  });
}

/* ======================================================================
   MASTER SEEK
   ====================================================================== */
const SC = [[sTitle, -1, 2.5, seekTitle], [s1, 2.5, 8.5, seek1], [s2, 8.5, 14.5, seek2], [s3, 14.5, 20.5, seek3], [s4, 20.5, 32, seek4], [sEnd, 32, 99, seekEnd]];
const IMPACTS = [tTimes.q, t1.coin, t5.more, t5.cut, tE.check];
function seek(t) {
  t = cl(t, 0, DUR);
  SC.forEach(([el, a, b, fn]) => { const on = t >= a && t < b; el.style.display = on ? 'block' : 'none'; if (on) fn(t); });
  // camera thunk on stamps
  let sx = 0, sy = 0;
  IMPACTS.forEach(ti => { const u = t - ti - .12; if (u > 0 && u < .5) { const a = 9 * Math.exp(-10 * u); sx += a * Math.sin(u * 70); sy += a * Math.cos(u * 55); } });
  world.style.transform = `translate(${sx}px,${sy}px)`;
  // chrome
  const bi = BEATS.findIndex(([a, b]) => t >= a && t < b);
  chrome.style.display = bi < 0 ? 'none' : 'block';
  if (bi >= 0) {
    chBeat.textContent = String(bi + 1).padStart(2, '0') + ' — ' + CHIPS[bi];
    chCount.textContent = String(bi + 1).padStart(2, '0') + ' / 05';
    if (WIDE) chBeat.style.left = (chBrand.offsetLeft + chBrand.offsetWidth + 16) + 'px';
    slam(chBeat, t, BEATS[bi][0] + (bi === 4 ? .05 : -.1), {dy: -24, dur: .35});
    chSq.forEach((q, i) => q.style.background = i <= bi ? (i === bi ? C.tomato : C.ink) : 'transparent');
    exTag.style.display = bi === 1 ? 'none' : 'block';
    if (bi === 0) { exTag.style.left = L(64, 120) + 'px'; exTag.style.top = L(1440, 760) + 'px'; }
    else if (bi === 2) { exTag.style.left = L(64, 1560) + 'px'; exTag.style.top = L(1520, 870) + 'px'; }
    else if (bi === 3) { exTag.style.left = L(800, 1560) + 'px'; exTag.style.top = L(1410, 870) + 'px'; }
    else { exTag.style.left = L(800, 1560) + 'px'; exTag.style.top = L(196, 870) + 'px'; }
  }
  seekWipes(t);
  seekCaps(t);
}

/* ======================================================================
   PLAYER / RENDER HOOKS
   ====================================================================== */
let T = 0, playing = false, last = 0;
function fit() {
  if (RENDER) { $('frame').style.width = W + 'px'; $('frame').style.height = H + 'px'; stage.style.transform = `scale(${innerWidth / W})`; $('frame').style.width = innerWidth + 'px'; $('frame').style.height = innerHeight + 'px'; return; }
  const s = Math.min((innerWidth - 40) / W, (innerHeight - 90) / H);
  $('frame').style.width = W * s + 'px'; $('frame').style.height = H * s + 'px'; stage.style.transform = `scale(${s})`;
}
addEventListener('resize', fit);
function ui() { $('fill').style.width = (T / DUR * 100) + '%'; $('time').textContent = T.toFixed(2) + ' / ' + DUR.toFixed(2); $('play').textContent = playing ? 'Pause' : 'Play'; }
function loop(now) { if (!playing) return; T += (now - last) / 1000; last = now; if (T >= DUR) { T = DUR; playing = false; } seek(T); ui(); if (playing) requestAnimationFrame(loop); }
function toggle() { if (T >= DUR) T = 0; playing = !playing; last = performance.now(); ui(); if (playing) requestAnimationFrame(loop); }
$('play').onclick = toggle;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); toggle(); } });
$('bar').onclick = e => { const r = $('bar').getBoundingClientRect(); T = cl((e.clientX - r.left) / r.width) * DUR; seek(T); ui(); };

(async () => {
  if (RENDER) document.body.classList.add('render');
  fit();
  try {
    await Promise.all(['400 100px "Archivo Black"', '700 40px "Space Grotesk"', '500 40px "Space Grotesk"', '500 40px "IBM Plex Mono"'].map(f => document.fonts.load(f)));
    await document.fonts.ready;
  } catch (e) {}
  seek(RENDER ? 0 : 1.2); if (!RENDER) { T = 1.2; ui(); }
  if (RENDER) { window.__seek = t => { T = t; seek(t); }; window.__duration = DUR; }
})();
})();
</script>
