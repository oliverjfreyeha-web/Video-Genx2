<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qualify Before Booking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Kalam:wght@400;700&display=block" rel="stylesheet">
<style>
  :root { --board:#FBFBF8; --ink:#1D1D1F; --blue:#2463EB; --red:#E5484D; --green:#1F9D55; --hl:#FFE066; }
  html, body { margin:0; height:100%; background:#1b1b1d; overflow:hidden; font-family: Kalam, cursive; }
  #stage { position:absolute; left:0; top:0; overflow:hidden; background:var(--board); transform-origin:0 0; }
  #stage svg { position:absolute; left:0; top:0; display:block; }
  #vig { position:absolute; inset:0; pointer-events:none;
         background: radial-gradient(ellipse 75% 70% at 50% 48%, rgba(0,0,0,0) 62%, rgba(40,40,30,0.075) 100%); }
  #cap { position:absolute; left:0; right:0; display:flex; justify-content:center; pointer-events:none; }
  #strip { position:relative; background:#FFFFFF; border-radius:6px;
           box-shadow: 0 1px 0 rgba(0,0,0,0.04), 0 10px 26px rgba(40,40,30,0.10), 0 2px 6px rgba(40,40,30,0.08);
           white-space:nowrap; }
  .tape { position:absolute; top:-14px; width:78px; height:28px; background:rgba(214,214,206,0.62); }
  .tape.l { left:-22px; transform:rotate(-14deg); }
  .tape.r { right:-22px; transform:rotate(11deg); }
  .chunk { display:none; color:var(--ink); font-family:Kalam, cursive; font-weight:700; letter-spacing:0.2px; }
  .w { position:relative; display:inline-block; }
  .w .hl { position:absolute; left:-7px; right:-7px; top:30%; bottom:2%; background:rgba(255,224,102,0.62); border-radius:4px 10px 6px 12px; }
  .w .tx { position:relative; }
  #ctrl { position:fixed; left:0; right:0; bottom:0; height:56px; display:flex; align-items:center; gap:14px; padding:0 18px;
          background:#111; color:#ddd; font:14px system-ui, sans-serif; }
  #ctrl button { background:#2463EB; color:#fff; border:0; border-radius:6px; padding:8px 16px; font:600 14px system-ui; cursor:pointer; }
  #bar { flex:1; height:8px; background:#333; border-radius:4px; position:relative; cursor:pointer; }
  #fill { position:absolute; left:0; top:0; bottom:0; background:#FFE066; border-radius:4px; }
  #time { width:110px; text-align:right; font-variant-numeric:tabular-nums; }
  body.render #ctrl { display:none; }
  body.render #stage { transform:none !important; }
</style>
</head>
<body>
<div id="stage">
  <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="vig"></div>
  <div id="cap"><div id="strip"><span class="tape l"></span><span class="tape r"></span></div></div>
</div>
<div id="ctrl"><button id="play">Play</button><div id="bar"><div id="fill"></div></div><div id="time">0.00 / 38.00</div></div>

<script type="application/json" id="vo">
[
 {"t0": 0.3, "t1": 1.9, "text": "Leads feel unqualified?"},
 {"t0": 2.8, "t1": 7.25, "text": "Often the leads aren't the problem. They get booked before anyone checks the fit."},
 {"t0": 8.8, "t1": 12.73, "text": "Qualify first: the job, the area, the timing, and the budget."},
 {"t0": 14.8, "t1": 18.96, "text": "Good fits go straight to the calendar. Maybe-later leads go to follow-up."},
 {"t0": 20.8, "t1": 24.1, "text": "Poor fits get a polite no, so your crew's time stays free."},
 {"t0": 26.8, "t1": 30.3, "text": "Fewer wasted trips. More estimates that turn into jobs."},
 {"t0": 32.3, "t1": 36.56, "text": "Let's review your intake questions. Book a call with Elevate Home Ads."}
]

<script>
(() => {
'use strict';
const Q = new URLSearchParams(location.search);
const RENDER = Q.has('render');
const P = Q.get('aspect') !== '16x9';            // portrait 9:16 by default
const SW = P ? 1080 : 1920, SH = P ? 1920 : 1080;
const DUR = 38;
const INK = '#1D1D1F', BLUE = '#2463EB', RED = '#E5484D', GREEN = '#1F9D55', HLC = '#FFE066', GREY = '#77777C', BOARD = '#FBFBF8';
const VO = JSON.parse(document.getElementById('vo').textContent);
const NS = 'http://www.w3.org/2000/svg';

// ---------- maths ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, u) => a + (b - a) * u;
function bezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sx = t => ((ax * t + bx) * t + cx) * t, sy = t => ((ay * t + by) * t + cy) * t;
  const dx = t => (3 * ax * t + 2 * bx) * t + cx;
  return x => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let t = x;
    for (let i = 0; i < 8; i++) { const e = sx(t) - x, d = dx(t); if (Math.abs(e) < 1e-6 || Math.abs(d) < 1e-6) break; t -= e / d; }
    t = clamp(t);
    return sy(t);
  };
}
const easeOut = bezier(0.23, 1, 0.32, 1);
const easeIO = bezier(0.77, 0, 0.175, 1);
const easeDraw = u => u < 0.5 ? 2 * u * u : 1 - 2 * (1 - u) * (1 - u);   // marker accelerates then settles
const prog = (t, s, d) => clamp((t - s) / d);

let seed = 20261009;
function rnd() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const jit = a => (rnd() * 2 - 1) * a;
const f1 = v => v.toFixed(1);
const pt = p => f1(p[0]) + ',' + f1(p[1]);

// ---------- hand-made path builders ----------
function curveCmds(pts) {     // Catmull-Rom through pts -> cubic commands (no M)
  let d = '';
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += 'C' + pt(c1) + ' ' + pt(c2) + ' ' + pt(p2);
  }
  return d;
}
const smooth = pts => 'M' + pt(pts[0]) + curveCmds(pts);
function segPts(a, b, w) {    // wobbly points from a to b
  const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
  const n = Math.max(2, Math.round(L / 110)), bow = jit(w);
  const out = [a];
  for (let i = 1; i < n; i++) { const u = i / n, o = bow * Math.sin(Math.PI * u) + jit(w * 0.35); out.push([a[0] + dx * u + nx * o, a[1] + dy * u + ny * o]); }
  out.push(b); return out;
}
function line(x1, y1, x2, y2, w = 2.2) { return smooth(segPts([x1 + jit(1), y1 + jit(1)], [x2 + jit(1), y2 + jit(1)], w)); }
function poly(pts, w = 2.2) {
  const P2 = pts.map(p => [p[0] + jit(1.2), p[1] + jit(1.2)]);
  let d = 'M' + pt(P2[0]);
  for (let i = 0; i < P2.length - 1; i++) d += curveCmds(segPts(P2[i], P2[i + 1], w));
  return d;
}
function rect(x, y, w, h, wob = 2.2) {
  const o = Math.min(10, w * 0.06);
  return poly([[x + jit(3), y + jit(2)], [x + w, y + jit(2)], [x + w + jit(2), y + h], [x + jit(2), y + h + jit(1)], [x - jit(2), y + o + 4]], wob);
}
function ellipse(cx, cy, rx, ry, a0 = -2.1, sweep = Math.PI * 2 + 0.38, wob = 0.035) {
  const n = Math.max(10, Math.round((rx + ry) / 9)), pts = [];
  let drift = 0;
  for (let i = 0; i <= n; i++) {
    const a = a0 + sweep * i / n; drift += jit(wob * 0.5); drift *= 0.8;
    const k = 1 + drift + (i / n) * jit(0.02);
    pts.push([cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]);
  }
  return smooth(pts);
}
function arrowHead(tip, from, size) {
  const a = Math.atan2(tip[1] - from[1], tip[0] - from[0]);
  const l = [tip[0] - Math.cos(a - 0.5) * size, tip[1] - Math.sin(a - 0.5) * size];
  const r = [tip[0] - Math.cos(a + 0.5) * size, tip[1] - Math.sin(a + 0.5) * size];
  return 'M' + pt([l[0] + jit(1.5), l[1] + jit(1.5)]) + 'L' + pt(tip) + 'L' + pt([r[0] + jit(1.5), r[1] + jit(1.5)]);
}
function tickD(x, y, s) { return smooth([[x - s * 0.5, y - s * 0.02], [x - s * 0.26, y + s * 0.2], [x - s * 0.08, y + s * 0.42]]) + curveCmds([[x - s * 0.08, y + s * 0.42], [x + s * 0.2, y - s * 0.05], [x + s * 0.62, y - s * 0.62]]); }
function qmarkD(x, y, s) { return smooth([[x - 0.34 * s, y - 0.62 * s], [x - 0.18 * s, y - 0.9 * s], [x + 0.14 * s, y - 0.95 * s], [x + 0.37 * s, y - 0.72 * s], [x + 0.28 * s, y - 0.44 * s], [x + 0.02 * s, y - 0.3 * s], [x - 0.02 * s, y - 0.06 * s]]); }
function zigzag(x, y, w, h, gap, up = true) {   // hatch fill, drawn bottom -> top
  const pts = []; const n = Math.max(1, Math.floor(h / gap));
  for (let i = 0; i <= n; i++) { const yy = up ? y + h - i * gap : y + i * gap; pts.push([(i % 2 ? x + w : x) + jit(2), yy + jit(1.5)]); }
  let d = 'M' + pt(pts[0]); for (let i = 1; i < pts.length; i++) d += 'L' + pt(pts[i]); return d;
}

// ---------- svg + registry ----------
function mk(tag, attrs = {}, parent) {
  const el = document.createElementNS(NS, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(el);
  return el;
}
const items = [];     // drawable items with pen tracking
const fades = [];     // opacity tweens
const movers = [];    // functions of t
let LENSCALE = true;  // whether getPointAtLength needs real length (detected)

function S(parent, d, o = {}) {    // marker stroke that draws itself
  const el = mk('path', { d, fill: 'none', stroke: o.c || INK, 'stroke-width': o.w || 6, 'stroke-linecap': o.cap || 'round', 'stroke-linejoin': 'round', pathLength: 1, 'stroke-dasharray': '1 1.0001' }, parent);
  if (o.op != null) el.setAttribute('opacity', o.op);
  const it = { kind: 'path', el, t: o.t, d: o.d || 0.3, col: o.pc || o.c || INK, pen: o.pen !== false, len: 0 };
  items.push(it); return el;
}
function T(parent, str, x, y, o = {}) {   // handwritten text that writes itself (clip reveal)
  const size = o.size || 60;
  const el = mk('text', { x, y, 'font-family': o.font === 'C' ? 'Caveat' : 'Kalam', 'font-weight': o.wt || 700, 'font-size': size, fill: o.c || INK, 'text-anchor': o.anchor || 'start' }, parent);
  el.textContent = str;
  if (o.ls) el.setAttribute('letter-spacing', o.ls);
  const bb = el.getBBox();
  const id = 'c' + items.length + '_' + Math.floor(rnd() * 1e6);
  const cp = mk('clipPath', { id, clipPathUnits: 'userSpaceOnUse' }, parent);
  const r = mk('rect', { x: bb.x - 12, y: bb.y - 30, width: 0, height: bb.height + 60 }, cp);
  el.setAttribute('clip-path', `url(#${id})`);
  const it = { kind: 'text', el, rect: r, bb, t: o.t, d: o.d || Math.max(0.18, str.length * 0.045), col: o.c || INK, pen: o.pen !== false };
  items.push(it); return el;
}
function H(parent, x1, y1, x2, y2, o = {}) {  // highlighter swipe
  const el = S(parent, smooth([[x1, y1 + jit(2)], [lerp(x1, x2, 0.5), lerp(y1, y2, 0.5) + jit(3)], [x2, y2 + jit(2)]]), { c: HLC, w: o.w || 40, t: o.t, d: o.d || 0.35, cap: 'butt', pc: HLC });
  el.setAttribute('opacity', 0.55); el.style.mixBlendMode = 'multiply';
  return el;
}
function F(el, t, d = 0.25, to = 1) { fades.push({ el, t, d, to }); el.setAttribute('opacity', 0); return el; }
function TW(g, keys) {   // transform keyframes [t, x, y, rot, scale]; ease-in-out between keys
  movers.push(t => {
    let k = keys[0];
    if (t >= keys[keys.length - 1][0]) k = keys[keys.length - 1];
    else for (let i = 0; i < keys.length - 1; i++) if (t >= keys[i][0] && t < keys[i + 1][0]) {
      const a = keys[i], b = keys[i + 1], u = easeIO((t - a[0]) / (b[0] - a[0]));
      k = [t, lerp(a[1], b[1], u), lerp(a[2], b[2], u), lerp(a[3] || 0, b[3] || 0, u), lerp(a[4] ?? 1, b[4] ?? 1, u)];
      break;
    }
    g.setAttribute('transform', `translate(${f1(k[1])},${f1(k[2])}) rotate(${(k[3] || 0).toFixed(2)}) scale(${(k[4] ?? 1).toFixed(4)})`);
  });
}
const G = (parent, x = 0, y = 0) => mk('g', { transform: `translate(${x},${y})` }, parent);

// ---------- reusable doodles ----------
function card(parent, x, y, w, h, t, o = {}) {   // stick-figure lead card, ~0.5s
  const g = G(parent, x, y);
  const sw = o.sw || Math.max(3.2, w * 0.034), c = o.c || INK;
  F(mk('rect', { x: 2, y: 2, width: w - 4, height: h - 4, rx: 6, fill: '#FFFFFF' }, g), t + 0.05, 0.2);
  S(g, rect(0, 0, w, h, 1.6), { t, d: 0.22, w: sw, c });
  S(g, ellipse(w * 0.3, h * 0.33, w * 0.105, w * 0.105, -1.6), { t: t + 0.22, d: 0.1, w: sw * 0.9 });
  S(g, smooth([[w * 0.13, h * 0.66], [w * 0.17, h * 0.52], [w * 0.3, h * 0.48], [w * 0.43, h * 0.52], [w * 0.47, h * 0.66]]), { t: t + 0.32, d: 0.08, w: sw * 0.9 });
  S(g, line(w * 0.58, h * 0.3, w * 0.86, h * 0.3, 1), { t: t + 0.4, d: 0.05, w: sw * 0.8, c: GREY });
  S(g, line(w * 0.58, h * 0.45, w * 0.78, h * 0.45, 1), { t: t + 0.45, d: 0.05, w: sw * 0.8, c: GREY });
  S(g, line(w * 0.13, h * 0.8, w * 0.86, h * 0.8, 1), { t: t + 0.5, d: 0.06, w: sw * 0.8, c: GREY });
  return g;
}
function calendar(parent, x, y, w, h, cols, rows, t, o = {}) {
  const sw = o.w || 5.5, hh = o.hh || Math.min(80, h * 0.16);
  let c = t; const at = d => { const s = c; c += d; return s; };
  S(parent, rect(x, y, w, h), { t: at(0.34), d: 0.34, w: sw });
  S(parent, line(x, y + hh, x + w, y + hh, 1.5), { t: at(0.08), d: 0.08, w: sw });
  for (let i = 1; i < cols; i++) S(parent, line(x + i * w / cols, y + hh, x + i * w / cols, y + h, 1.5), { t: at(0.045), d: 0.05, w: sw * 0.6, c: '#4A4A50' });
  for (let j = 1; j < rows; j++) S(parent, line(x, y + hh + j * (h - hh) / rows, x + w, y + hh + j * (h - hh) / rows, 1.5), { t: at(0.05), d: 0.06, w: sw * 0.6, c: '#4A4A50' });
  for (const rx of [0.25, 0.75]) S(parent, smooth([[x + w * rx, y + 16], [x + w * rx - 7, y - 4], [x + w * rx, y - 18], [x + w * rx + 7, y - 4]]), { t: at(0.05), d: 0.06, w: sw * 0.9 });
  if (o.days) { const L = o.days; for (let i = 0; i < cols; i++) T(parent, L[i], x + (i + 0.5) * w / cols, y + hh * 0.74, { font: 'C', size: hh * 0.62, c: GREY, anchor: 'middle', t: at(0.04), d: 0.06, pen: false }); }
  return { end: c, slot: (ci, ri) => ({ x: x + ci * w / cols, y: y + hh + ri * (h - hh) / rows, w: w / cols, h: (h - hh) / rows }) };
}
function clockDoodle(parent, cx, cy, r, t, c, spinFrom, spinTo) {
  S(parent, ellipse(cx, cy, r, r * 0.98, -1.7), { t, d: 0.32, w: 6, c });
  for (let i = 0; i < 12; i += 3) { const a = i / 12 * Math.PI * 2; S(parent, line(cx + Math.cos(a) * r * 0.8, cy + Math.sin(a) * r * 0.8, cx + Math.cos(a) * r * 0.9, cy + Math.sin(a) * r * 0.9, 0.5), { t: t + 0.32 + i * 0.012, d: 0.03, w: 5, c, pen: false }); }
  const hand = G(parent, cx, cy);
  S(hand, line(0, 0, 0, -r * 0.62, 0.5), { t: t + 0.4, d: 0.08, w: 6.5, c });
  const hand2 = G(parent, cx, cy);
  S(hand2, line(0, 0, r * 0.42, 0, 0.5), { t: t + 0.48, d: 0.07, w: 6.5, c });
  movers.push(tt => {
    const u = prog(tt, spinFrom, spinTo - spinFrom);
    hand.setAttribute('transform', `translate(${cx},${cy}) rotate(${f1(u * 360 * 1.5)})`);
    hand2.setAttribute('transform', `translate(${cx},${cy}) rotate(${f1(u * 360 * 0.125)})`);
  });
}
function stickWorker(parent, x, y, s, t, hatC) {   // simple crew figure, feet at (x,y)
  S(parent, ellipse(x, y - s * 0.86, s * 0.1, s * 0.1, -1.4), { t, d: 0.1, w: 5 });
  S(parent, smooth([[x - s * 0.15, y - s * 0.93], [x, y - s * 1.06], [x + s * 0.15, y - s * 0.93]]) + 'M' + pt([x - s * 0.19, y - s * 0.92]) + 'L' + pt([x + s * 0.19, y - s * 0.92]), { t: t + 0.1, d: 0.1, w: 6, c: hatC });
  S(parent, line(x, y - s * 0.75, x, y - s * 0.35, 1), { t: t + 0.2, d: 0.06, w: 5 });
  S(parent, poly([[x - s * 0.17, y - s * 0.45], [x, y - s * 0.65], [x + s * 0.17, y - s * 0.48]], 1), { t: t + 0.26, d: 0.08, w: 5 });
  S(parent, poly([[x - s * 0.14, y], [x, y - s * 0.35], [x + s * 0.14, y]], 1), { t: t + 0.34, d: 0.08, w: 5 });
}

// ---------- build ----------
const svg = document.getElementById('svg');
svg.setAttribute('width', SW); svg.setAttribute('height', SH); svg.setAttribute('viewBox', `0 0 ${SW} ${SH}`);
const stage = document.getElementById('stage');
stage.style.width = SW + 'px'; stage.style.height = SH + 'px';

const defs = mk('defs', {}, svg);
const filt = mk('filter', { id: 'rough', x: '-3%', y: '-3%', width: '106%', height: '106%' }, defs);
mk('feTurbulence', { type: 'fractalNoise', baseFrequency: '0.9', numOctaves: '2', seed: '7', result: 'n' }, filt);
mk('feDisplacementMap', { in: 'SourceGraphic', in2: 'n', scale: '1.5', xChannelSelector: 'R', yChannelSelector: 'G' }, filt);
const sh = mk('filter', { id: 'soft', x: '-50%', y: '-50%', width: '200%', height: '200%' }, defs);
mk('feGaussianBlur', { stdDeviation: '5' }, sh);

mk('rect', { x: 0, y: 0, width: SW, height: SH, fill: BOARD }, svg);
const world = mk('g', {}, svg);
const ghosts = mk('g', { opacity: 1 }, world);
const wipeLayer = mk('g', {}, svg);
const endLayer = mk('g', {}, svg);
const penLayer = mk('g', {}, svg);

// scene placement on one long board
const GAP = P ? 160 : 220;
const GRID = [[0, 0], [1, 0], [1, 1], [2, 1], [2, 2], [3, 2]];
const ORIG = GRID.map(([c, r]) => [c * (SW + GAP), r * (SH + GAP)]);
const BOUNDS = [32, 2.5, 8.5, 14.5, 20.5, 26.5, 32];   // scene starts (title at 0)
const SCENE_T = [0, 2.5, 8.5, 14.5, 20.5, 26.5];
const sceneG = ORIG.map(o => {
  const g = mk('g', { transform: `translate(${o[0]},${o[1]})` }, world);
  const hl = mk('g', {}, g);
  const ink = mk('g', { filter: 'url(#rough)' }, g);
  return { hl, ink };
});

function buildGhosts() {   // faint marker ghosting from earlier sessions on the board
  const maxX = 4 * (SW + GAP), maxY = 3 * (SH + GAP);
  for (let i = 0; i < 150; i++) {
    const x = -SW * 0.5 + rnd() * (maxX + SW), y = -SH * 0.5 + rnd() * (maxY + SH);
    const L = 60 + rnd() * 260, a = jit(0.5), pts = [];
    for (let k = 0; k <= 4; k++) pts.push([x + Math.cos(a) * L * k / 4 + jit(10), y + Math.sin(a) * L * k / 4 + jit(14)]);
    mk('path', { d: smooth(pts), fill: 'none', stroke: rnd() < 0.15 ? '#7d8fb5' : '#1D1D1F', 'stroke-width': 6 + rnd() * 18, 'stroke-linecap': 'round', opacity: (0.018 + rnd() * 0.03).toFixed(3) }, ghosts);
  }

  else {
    fit(); addEventListener('resize', fit); setT(Q.has('t') ? +Q.get('t') : 0);
    document.getElementById('play').onclick = toggle;
    addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); toggle(); } });
    const bar = document.getElementById('bar');
    bar.onclick = e => { const r = bar.getBoundingClientRect(); setT((e.clientX - r.left) / r.width * DUR); };
  }
})();
})();
</script>
</body>
</html>
