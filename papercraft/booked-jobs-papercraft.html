<style>

{

  const roof = shade(new THREE.Mesh(new THREE.ExtrudeGeometry(sh, { depth: .96, bevelEnabled: false }), mat(C.teal)));
  roof.position.set(0, legH + .86, -.48); body.add(roof);
  const chim = box(.14, .26, .14, C.coral); chim.position.set(.3, legH + 1.18, -.1); body.add(chim);
  const eyes = [-.22, .22].map(x => { const e = new THREE.Group(); const p = shade(new THREE.Mesh(new RoundedBoxGeometry(.22, .25, .05, 2, .02), eyeM)); e.add(p);
    const m1 = box(.025, .25, .06, C.cream, .005), m2 = box(.22, .025, .06, C.cream, .005); e.add(m1, m2); e.position.set(x, legH + .56, .42); body.add(e); return e; });
  const door = box(.26, .3, .05, C.coral, .02); door.position.set(0, legH + .16, .42); body.add(door);
  const knob = box(.04, .04, .04, C.paper, .01); knob.position.set(.07, legH + .16, .46); body.add(knob);
  const legs = [-.24, .24].map(x => { const l = box(.17, legH, .17, C.navy, .03); l.position.set(x, legH / 2, 0); g.add(l); return l; });
  const arms = [-1, 1].map(s => { const pv = new THREE.Group(); pv.position.set(s * .53, legH + .62, 0); const a = box(.1, .42, .1, C.cream, .03); a.position.y = -.19; pv.add(a); body.add(pv); return pv; });
  g.scale.setScalar(scale);
  const api = {
    g,
    // pose for a local time t: hop height, arm wave, walk cycle, glow, blink; every value is set fresh each frame
    pose(t, { hop = 0, wave = 0, cheer = 0, walk = 0, glow = 0, lean = 0, look = 0, surprise = 0 } = {}) {
      const breathe = Math.sin(t * 2.2) * .015;
      body.position.y = hop + breathe; body.rotation.z = lean; body.rotation.y = look;
      const blink = (t % 3.1) > 2.95 ? .15 : 1;
      eyes.forEach(e => { e.scale.set(1 + surprise * .35, blink * (1 + surprise * .45), 1); });
      eyeM.emissiveIntensity = glow * 1.4;
      const ph = walk * Math.PI * 2;
      legs[0].position.y = .13 + Math.max(0, Math.sin(ph)) * .12 * (walk ? 1 : 0) + hop * .3;
      legs[1].position.y = .13 + Math.max(0, -Math.sin(ph)) * .12 * (walk ? 1 : 0) + hop * .3;
      if (walk) body.position.y += Math.abs(Math.sin(ph)) * .06;
      arms[0].rotation.z = -.15 - cheer * 2.6 + (walk ? Math.sin(ph) * .4 : 0);
      arms[1].rotation.z = .15 + cheer * 2.6 + wave * (2.3 + Math.sin(t * 14) * .35) - (walk ? Math.sin(ph) * .4 : 0);
    },
  };
  return api;
}

// ---------- scene builders: each returns { group, update(local) } at its own station ----------
const builds = [];
const at = (s, obj, x, y, z) => { obj.position.set(s * STEP + x, y, z); scene.add(obj); return obj; };
const pop = (o, p, base = 1) => { const s = Math.max(.0001, back(clamp(p)) * base); o.scale.setScalar(s); o.visible = p > 0; };

// slip = one lead (small paper card with an envelope mark)
function slip(win) {
  return card(.42, .3, .02, win ? C.teal : C.paper, (x, w, h) => {
    x.strokeStyle = win ? '#fff' : C.coral; x.lineWidth = 3; x.strokeRect(8, 8, w - 16, h - 16);
    x.beginPath(); x.moveTo(8, 8); x.lineTo(w / 2, h / 2 + 2); x.lineTo(w - 8, 8); x.stroke();
    if (win) txt(x, '✓ JOB', w / 2, h - 12, 9, { color: '#fff' });
  }, 300);
}

// station 0: title card + scene 0 (60 leads rain down; only two become jobs)
{
  const s = 0, m = mascot(1.15); at(s, m.g, 0, 0, 1.1);
  const r = rng(60), slips = [], greyM = mat('#7E848C');
  for (let i = 0; i < 60; i++) {
    const win = i === 17 || i === 42, sl = slip(win);
    const tx = (r() - .5) * 4.4, tz = -.6 + r() * 2.8;
    if (Math.abs(tx) < .75 && tz > .5) { sl.userData.skip = true; }
    sl.userData = { ...sl.userData, win, tx: Math.abs(tx) < .75 && tz > .4 ? tx + Math.sign(tx || 1) * .9 : tx, tz, ry: r() * 6.28, delay: .15 + i * .028 + r() * .1, spin: (r() - .5) * 9 };
    sl.userData.dim = sl.material.slice(); sl.userData.dimM = sl.material.map(() => greyM);
    at(s, sl, 0, -5, 0); slips.push(sl);
  }
  const sign = card(2.6, 1.5, .08, C.paper, null, 220); at(s, sign, 0, 3.15, -1.4); sign.rotation.x = -.04;
  const post = box(.1, 2.4, .1, '#3A2A1E'); at(s, post, 0, 1.2, -1.5);
  builds[0] = local => {                         // title card: mascot alone, a couple of slips drifting
    slips.forEach(sl => sl.visible = false); sign.visible = false; post.visible = false;
    m.pose(local, { look: Math.sin(local * 1.2) * .15 });
  };
  builds[1] = local => {
    post.visible = true;
    slips.forEach((sl, i) => {
      const u = sl.userData, p = prog(local, u.delay, .75);
      sl.visible = p > 0;
      const winRise = u.win ? eOut(prog(local, 2.8, .7)) : 0;
      const y = lerp(5.2, .03 + (i % 5) * .012, eOut(p)) + winRise * (1.8 - .03);
      const ox = u.win ? lerp(u.tx, i === 17 ? -1.45 : 1.45, winRise) : u.tx, oz = u.win ? lerp(u.tz, 1.6, winRise) : u.tz;
      sl.position.set(s * STEP + ox, y, oz);
      const spin = (1 - eOut(p)) * u.spin;
      sl.rotation.set(-Math.PI / 2 * (1 - winRise) + spin * .3, u.ry * (1 - winRise) + spin, spin * .2);
      const dark = !u.win && local > 2.6 + (i % 12) * .03;
      sl.material = dark ? u.dimM : u.dim;
    });
    pop(sign, prog(local, .6, .5));
    sign.userData.draw((x, w, h) => {
      txt(x, '60 LEADS', w / 2, 52, 50);
      if (local > 2.7) { txt(x, '2 JOBS', w / 2, 112, 50, { color: C.teal }); }
      else { x.fillStyle = 'rgba(0,0,0,.12)'; x.fillRect(60, 95, w - 120, 34); }
    }, local > 2.7 ? 'b' : 'a');
    m.pose(local, { hop: Math.max(0, Math.sin(prog(local, 3.0, .45) * Math.PI)) * .45, glow: prog(local, 3, .3), look: local < 2.6 ? -.2 : 0, surprise: prog(local, .3, .3) * (1 - prog(local, 2.4, .3)) });
  };
}

    const w = prog(local, .6, 4.6), mx = lerp(-3.4, 3.2, w);
    m.g.position.x = s * STEP + mx;
    m.pose(local, { walk: local > .6 && local < 5.2 ? local * 1.7 : 0, look: local > .6 && local < 5.2 ? Math.PI / 2 * .35 : 0, glow: .4 });
    env.forEach(e => { const lit = clamp((mx - e.x + .2) / .3); e.on.visible = lit > .5; e.off.visible = !e.on.visible; e.g.rotation.y = Math.sin(lit * Math.PI) * 1.2; e.g.rotation.z = Math.sin(local * 2 + e.x) * .04; });
  };
  builds[6].camX = local => lerp(-3.4, 3.2, prog(local, .6, 4.6));
}

// station 6: track booked jobs — bars grow 2 → 9, the mascot jumps on top
{
  const s = 6, vals = [2, 3, 4, 6, 8, 9], m = mascot(.8);
  at(s, m.g, 2.9, 0, .9);
  const bars = vals.map((v, i) => { const h = v * .32, b = box(.62, h, .62, i === 0 ? C.grey : i === 5 ? C.teal : C.blue, .04); b.geometry.translate(0, h / 2, 0); at(s, b, -2.1 + i * .84, 0, 0); b.userData.h = h; return b; });
  const nums = vals.map((v, i) => { const c = card(.56, .38, .03, C.paper, (x, w, h) => txt(x, String(v), w / 2, h / 2 + 1, 26, { color: i === 5 ? C.teal : C.ink }), 260); at(s, c, -2.1 + i * .84, 0, .1); return c; });
  const kpis = [['15%', 'BOOKING RATE'], ['$267', 'PER JOB']].map(([a, b], i) => { const c = card(1.5, .9, .05, C.paper, (x, w, h) => { txt(x, a, w / 2, 38, 38, { color: C.teal }); txt(x, b, w / 2, 72, 13, { family: 'Oswald', weight: 600 }); }, 260); at(s, c, i ? 1.05 : -1.05, .5, 2.2); c.rotation.set(-.25, i ? -.18 : .18, 0); return c; });
  const r = rng(9), bits = Array.from({ length: 46 }, (_, i) => { const b = box(.09, .13, .01, [C.coral, C.teal, C.butter, C.paper, C.sky][i % 5], .005); at(s, b, 0, -3, 0); b.userData = { vx: (r() - .5) * 3.4, vy: 2.5 + r() * 3, vz: (r() - .5) * 2, sp: r() * 12 }; return b; });
  builds[7] = local => {
    bars.forEach((b, i) => { const p = eOut(prog(local, .4 + i * .3, .65)); b.scale.set(1, Math.max(.001, p), 1); nums[i].position.y = b.userData.h * p + .26; nums[i].visible = p > .05; });
    // the mascot hops onto the tallest bar at 2.9 s
    const j = eInOut(prog(local, 2.6, .7)), top = bars[5].userData.h;
    m.g.position.set(s * STEP + lerp(2.9, 2.1, j), lerp(0, top, j) + Math.sin(j * Math.PI) * 1.1, lerp(.9, 0, j));
    m.pose(local, { cheer: prog(local, 3.3, .3), hop: local > 3.3 ? Math.abs(Math.sin((local - 3.3) * 5)) * .18 : 0, glow: prog(local, 3.3, .3), look: -.25 * (1 - j) });
    const bt = local - 3.35;
    bits.forEach(b => { const u = b.userData; b.visible = bt > 0 && bt < 2.6; if (!b.visible) return; b.position.set(s * STEP + 2.1 + u.vx * bt, top + 1.2 + u.vy * bt - 4.9 * bt * bt * .55, u.vz * bt); b.rotation.set(u.sp * bt, u.sp * bt * .7, u.sp * bt * .3); });
    kpis.forEach((c, i) => pop(c, prog(local, 3.8 + i * .3, .4)));
  };
}

// station 7: one productized system — a turntable with the steps orbiting
{
  const s = 7, m = mascot(1);
  const table = shade(new THREE.Mesh(new THREE.CylinderGeometry(1.25, 1.35, .24, 48), mat(C.teal))); at(s, table, 0, .12, .5);
  at(s, m.g, 0, .24, .5);
  const tags = ['CAPTURE', 'RESPOND', 'QUALIFY', 'FOLLOW UP', 'BOOK', 'MEASURE'].map((l, i) => { const c = card(1.25, .42, .04, i % 2 ? C.paper : C.butter, (x, w, h) => txt(x, l, w / 2, h / 2 + 1, 17), 260); at(s, c, 0, 0, 0); return c; });
  const sign = card(2.4, .62, .05, C.coral, (x, w, h) => txt(x, 'BOOKED JOBS ↑', w / 2, h / 2 + 2, 24, { color: '#fff' }), 240); at(s, sign, 0, 3.2, .2);
  builds[8] = local => {
    const a0 = local * .55;
    tags.forEach((c, i) => {
      const a = a0 + i / 6 * Math.PI * 2, p = prog(local, .4 + i * .18, .4);
      c.position.set(s * STEP + Math.sin(a) * 1.95, 1.55 + Math.sin(a * 2 + i) * .12, .5 + Math.cos(a) * 1.3); c.rotation.y = 0; pop(c, p);
    });
    table.rotation.y = local * .5; m.g.rotation.y = Math.sin(local * .8) * .5;
    pop(sign, prog(local, 1.6, .45)); sign.position.y = 3.2 + Math.sin(local * 2) * .06;
    m.pose(local, { glow: .6, wave: prog(local, 2.4, .3) * (1 - prog(local, 4.2, .3)) });
  };
}

// station 8: end card — the mascot waves in front of a paper sign
{
  const s = 8, m = mascot(1.2); at(s, m.g, 0, 0, 1.1);
  const sign = card(3.1, 1.6, .08, C.paper, (x, w, h) => {
    x.fillStyle = C.teal; x.beginPath(); x.moveTo(w / 2 - 34, 66); x.lineTo(w / 2, 34); x.lineTo(w / 2 + 34, 66); x.closePath(); x.fill();
    x.fillStyle = C.cream; x.fillRect(w / 2 - 24, 66, 48, 34); x.fillStyle = C.coral; x.fillRect(w / 2 - 7, 80, 14, 20);
    txt(x, 'SAME LEADS.', w / 2, 120, 22); txt(x, 'MORE BOOKED JOBS.', w / 2, 146, 22, { color: C.teal });
  }, 240);
  at(s, sign, 0, 3.0, -1.2);
  const post = box(.1, 2.3, .1, '#3A2A1E'); at(s, post, 0, 1.1, -1.3);
  const r = rng(3), bits = Array.from({ length: 40 }, (_, i) => { const b = box(.09, .13, .01, [C.coral, C.teal, C.butter, C.paper][i % 4], .005); at(s, b, 0, -3, 0); b.userData = { x: (r() - .5) * 5, z: -1 + r() * 3, d: r() * 4, sp: r() * 6 }; return b; });
  builds[9] = local => {
    pop(sign, prog(local, .2, .5));
    m.pose(local, { wave: prog(local, .5, .3), glow: 1, hop: Math.max(0, Math.sin(prog(local, .3, .45) * Math.PI)) * .4 });
    bits.forEach(b => { const u = b.userData, y = 6 - ((local * .9 + u.d) % 4) * 1.6; b.position.set(s * STEP + u.x + Math.sin(local + u.d) * .3, y, u.z); b.rotation.set(local * u.sp, local * u.sp * .6, 0); b.visible = local > .2; });
  };
}

// ---------- camera per scene (station-relative), with a little handheld drift ----------
const CAM = [
  l => [V(0, 5.2 - 2.4 * eOut(prog(l, 0, 2.5)), 15 - 5 * eOut(prog(l, 0, 2.5))), V(0, 1.4, 0), 10],
  l => [V(.8 - 1.4 * eInOut(prog(l, 0, 5)), 2.9, 10.2 - .8 * prog(l, 0, 5)), V(0, 1.7, 0), 9.5],
  l => [V(-.4 + .8 * prog(l, 0, 6), 2.8, 10.4 - .9 * eOut(prog(l, 0, 6))), V(.1, 1.7, 0), 9.6],
  l => { const p = eInOut(prog(l, .2, 6.4)); return [V(lerp(-3.6, 3.4, p), 2.9, 8.6), V(lerp(-3, 2.9, p), 1.6, 0), 8.6]; },
  l => [V(.3, 2.9, 9.6 - 1 * eOut(prog(l, 0, 6))), V(.3, 1.95, 0), 9],
  l => { const p = eInOut(prog(l, 2.7, 1.4)); return [V(.2, 3.2 - .5 * p, 10 - .4 * prog(l, 0, 6)), V(0, lerp(2.7, 1.8, p), 0), 9.6]; },
  l => { const x = builds[6].camX(l); return [V(x * .75, 2.7, 8.8), V(x * .8, 2.0, 0), 8.6]; },
  l => { const p = eInOut(prog(l, 2.4, 1.2)); return [V(.4, 2.7 + p * .6, 10 - p * .6), V(.3, 1.4 + p * .9, 0), 9.5]; },
  l => [V(Math.sin(l * .35) * 1.6, 3.6, 9.4), V(0, 1.7, .5), 8.9],
  l => [V(0, 2.8, 8.6 + 1.2 * eOut(prog(l, 0, 6))), V(0, 1.9, 0), 8.8],
];
function camAt(i, l) {
  const [p, q, f] = CAM[i](l), sx = STATION[i] * STEP;
  p.x += sx; q.x += sx;
  const h = (a, b) => Math.sin(l * a + b) * .035 + Math.sin(l * a * 2.3 + b * 3) * .015;
  p.x += h(1.1, i); p.y += h(.9, i + 2); q.x += h(.7, i + 5);
  return [p, q, f];
}

// ---------- overlays ----------
const captions = JSON.parse($('captions').textContent || '[]');
const chunks = [];
captions.forEach(c => {                       // up to 3 words per chunk, each word timed by its share of the characters
  const words = c.text.split(' '), total = c.text.length; let acc = 0;
  const timed = words.map(w => { const t = c.t0 + (acc / total) * (c.t1 - c.t0); acc += w.length + 1; return { w, t }; });
  for (let i = 0; i < timed.length; i += 3) chunks.push({ words: timed.slice(i, i + 3), end: i + 3 < timed.length ? timed[i + 3].t : c.t1 + .35 });
});
const strip = $('strip'), tapes = $('tapes'), lower = $('lower'), caps = $('caps'), cta = $('cta');
const TILT = [-1.6, 1.2, -1, 1.4, -1.3, .9, -1.1, 1.3, -.8, 1];
let lastScene = -1, lastChunk = -2;
function overlays(t, i, local) {
  const sc = SCENES[i];
  if (i !== lastScene) {
    strip.textContent = sc.title;
    lower.innerHTML = sc.lower ? `${sc.lower[0]}<br>${sc.lower[1]}${i >= 1 && i <= 2 || i === 7 ? '<small>Example numbers</small>' : ''}` : '';
    lastScene = i;
  }
  const sp = prog(local, .02, .42);
  strip.style.opacity = Math.min(1, sp * 3); strip.style.transform = `translateY(${(1 - back(sp)) * -50}px) rotate(${TILT[i] * back(sp)}deg)`;
  const w = strip.offsetWidth;
  tapes.style.transform = strip.style.transform; tapes.style.opacity = strip.style.opacity;
  tapes.innerHTML = `<span class="tape" style="left:${-w / 2 - 34}px;top:-6px;rotate:-24deg"></span><span class="tape" style="left:${w / 2 - 82}px;top:-10px;rotate:20deg"></span>`;
  const lp = sc.lower ? prog(local, .85, .45) * (1 - prog(local, sc.dur - .45, .35)) : 0;
  lower.style.visibility = lp > 0 ? 'visible' : 'hidden'; lower.style.transform = `translateX(${(1 - back(lp)) * -820}px) rotate(-1.2deg)`;
  const ce = i === 9 ? prog(local, .7, .45) : 0;
  cta.classList.toggle('hidden', ce <= 0); cta.style.transform = `scale(${.6 + .4 * back(ce)}) rotate(${-1.5 * back(ce)}deg)`;
  const k = chunks.findIndex(c => t >= c.words[0].t - .05 && t < c.end);
  if (k !== lastChunk) { caps.innerHTML = k < 0 ? '' : chunks[k].words.map((x, j) => `<span class="word" style="rotate:${[-2.5, 1.8, -1.2][j]}deg">${x.w}</span>`).join(''); lastChunk = k; }
  if (k >= 0) [...caps.children].forEach((el, j) => { const p = prog(t, chunks[k].words[j].t - .04, .18); el.style.opacity = p > 0 ? 1 : 0; el.style.transform = `scale(${.55 + .45 * back(p)})`; });
}

// ---------- one clock ----------
const tmpF = new THREE.Vector3();
function seek(t) {
  t = clamp(t, 0, DUR - 1e-4);
  const i = SCENES.findLastIndex(s => t >= s.at), local = t - SCENES[i].at;
  for (let k = 0; k < builds.length; k++) if (k !== i && STATION[k] !== STATION[i]) { /* other stations keep their last pose; they're off camera */ }
  builds[i](local);
  let [p, q, f] = camAt(i, local), blur = 0;
  if (i > 0 && local < WHIP) {                   // whip from the previous scene's last frame to this scene's framing
    const pi = i - 1, [p0, q0, f0] = camAt(pi, SCENES[pi].dur), [p1, q1, f1] = camAt(i, WHIP), e = eInOut(local / WHIP);
    if (STATION[pi] !== STATION[i]) { p = p0.clone().lerp(p1, e); q = q0.clone().lerp(q1, e); f = lerp(f0, f1, e); blur = Math.sin(Math.PI * local / WHIP); }
  }
  camera.position.copy(p); camera.lookAt(q);
  placeLights(Math.round(camera.position.x / STEP) * STEP);
  dust.material.opacity = .45 + Math.sin(t * 1.7) * .1; dust.position.y = Math.sin(t * .3) * .2;
  canvas.style.filter = blur > .02 ? `blur(${(blur * 9).toFixed(1)}px)` : 'none';
  if (composer) { bokeh.uniforms.focus.value = f; composer.render(); } else renderer.render(scene, camera);
  overlays(t, i, local);
}

// ---------- player ----------
const stage = $('stage'), frame = $('frame');
const fit = () => { stage.style.transform = `scale(${frame.clientWidth / 1080})`; };
new ResizeObserver(fit).observe(frame); fit();
const audio = new Audio(); let hasAudio = false;
const b64 = ($('soundtrack').textContent || '').trim();
if (!RENDER && b64.length > 100) { const bin = atob(b64), u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i); audio.src = URL.createObjectURL(new Blob([u8], { type: 'audio/mpeg' })); hasAudio = true; }
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
let T = 0, playing = false, last = 0;
function paint() { $('fill').style.transform = `scaleX(${T / DUR})`; $('time').textContent = `${fmt(T)} / ${fmt(DUR)}`; }
function play() { if (T >= DUR - .05) T = 0; playing = true; last = performance.now(); $('cover').classList.add('hidden'); if (hasAudio) { audio.currentTime = T; audio.play().catch(() => { hasAudio = false; }); } $('play').textContent = '❚❚'; requestAnimationFrame(tick); }
function pause() { playing = false; if (hasAudio) audio.pause(); $('play').textContent = '▶'; }
function tick(now) { if (!playing) return; if (hasAudio && !audio.paused && audio.readyState >= 2) T = audio.currentTime; else T += (now - last) / 1000; last = now; if (T >= DUR) { T = DUR; pause(); } seek(T); paint(); if (playing) requestAnimationFrame(tick); }
$('play').onclick = () => playing ? pause() : play(); $('bigplay').onclick = play;
$('sound').onclick = () => { audio.muted = !audio.muted; $('sound').textContent = audio.muted ? '♪ OFF' : '♪ ON'; };
$('track').onclick = e => { const r = e.currentTarget.getBoundingClientRect(); T = clamp((e.clientX - r.left) / r.width) * DUR; if (hasAudio) audio.currentTime = T; seek(T); paint(); };
document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); } });

if (RENDER) { document.body.classList.add('render'); $('cover').classList.add('hidden'); window.__seek = t => seek(t); window.__duration = DUR; }
seek(1.2); paint();
window.__ready = true;
</script>
</body>
</html>
